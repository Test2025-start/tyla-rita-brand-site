<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600">
  <defs>
    <linearGradient id="surface" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#faf8f5;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#ede8e0;stop-opacity:1"/>
    </linearGradient>
    <radialGradient id="spotlight" cx="50%" cy="30%" r="60%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.9"/>
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0d78c"/>
      <stop offset="30%" style="stop-color:#e2b04a"/>
      <stop offset="50%" style="stop-color:#f7e8b0"/>
      <stop offset="70%" style="stop-color:#d4a017"/>
      <stop offset="100%" style="stop-color:#c9970a"/>
    </linearGradient>
    <linearGradient id="goldGrad2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#c9970a"/>
      <stop offset="50%" style="stop-color:#f7e8b0"/>
      <stop offset="100%" style="stop-color:#e2b04a"/>
    </linearGradient>
    <radialGradient id="pearlGrad" cx="40%" cy="35%" r="55%">
      <stop offset="0%" style="stop-color:#ffffff"/>
      <stop offset="30%" style="stop-color:#f8f5f0"/>
      <stop offset="60%" style="stop-color:#e8ddd5"/>
      <stop offset="80%" style="stop-color:#d4c5b9"/>
      <stop offset="100%" style="stop-color:#b8a99a"/>
    </radialGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#000" flood-opacity="0.15"/></filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="600" height="600" fill="url(#surface)"/>
  <rect width="600" height="600" fill="url(#spotlight)"/>
  <g transform="translate(300,280)" filter="url(#shadow)">
    <path d="M-180,-20 C-140,-100 140,-100 180,-20" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-dasharray="8,6"/>
    <path d="M-170,-10 C-130,-80 130,-80 170,-10" fill="none" stroke="url(#goldGrad2)" stroke-width="1.2" opacity="0.6"/>
    <circle cx="-140" cy="-15" r="8" fill="url(#pearlGrad)" stroke="url(#goldGrad)" stroke-width="0.5"/><circle cx="-140" cy="-18" r="2.5" fill="white" opacity="0.6"/>
    <circle cx="-110" cy="-45" r="8" fill="url(#pearlGrad)" stroke="url(#goldGrad)" stroke-width="0.5"/><circle cx="-110" cy="-48" r="2.5" fill="white" opacity="0.6"/>
    <circle cx="-80" cy="-65" r="8" fill="url(#pearlGrad)" stroke="url(#goldGrad)" stroke-width="0.5"/><circle cx="-80" cy="-68" r="2.5" fill="white" opacity="0.6"/>
    <circle cx="-50" cy="-80" r="8" fill="url(#pearlGrad)" stroke="url(#goldGrad)" stroke-width="0.5"/><circle cx="-50" cy="-83" r="2.5" fill="white" opacity="0.6"/>
    <circle cx="-20" cy="-88" r="8" fill="url(#pearlGrad)" stroke="url(#goldGrad)" stroke-width="0.5"/><circle cx="-20" cy="-91" r="2.5" fill="white" opacity="0.6"/>
    <circle cx="20" cy="-88" r="8" fill="url(#pearlGrad)" stroke="url(#goldGrad)" stroke-width="0.5"/><circle cx="20" cy="-91" r="2.5" fill="white" opacity="0.6"/>
    <circle cx="50" cy="-80" r="8" fill="url(#pearlGrad)" stroke="url(#goldGrad)" stroke-width="0.5"/><circle cx="50" cy="-83" r="2.5" fill="white" opacity="0.6"/>
    <circle cx="80" cy="-65" r="8" fill="url(#pearlGrad)" stroke="url(#goldGrad)" stroke-width="0.5"/><circle cx="80" cy="-68" r="2.5" fill="white" opacity="0.6"/>
    <circle cx="110" cy="-45" r="8" fill="url(#pearlGrad)" stroke="url(#goldGrad)" stroke-width="0.5"/><circle cx="110" cy="-48" r="2.5" fill="white" opacity="0.6"/>
    <circle cx="140" cy="-15" r="8" fill="url(#pearlGrad)" stroke="url(#goldGrad)" stroke-width="0.5"/><circle cx="140" cy="-18" r="2.5" fill="white" opacity="0.6"/>
    <g transform="translate(0,20)" filter="url(#softGlow)">
      <ellipse cx="0" cy="0" rx="16" ry="20" fill="url(#pearlGrad)" stroke="url(#goldGrad)" stroke-width="1.5"/>
      <ellipse cx="-5" cy="-6" rx="5" ry="4" fill="white" opacity="0.5"/>
      <path d="M-4,-22 L4,-22 L3,-18 L-3,-18 Z" fill="url(#goldGrad)"/>
    </g>
  </g>
  <text x="300" y="560" text-anchor="middle" font-family="Georgia,serif" font-size="14" fill="#d4c5b9" letter-spacing="8" opacity="0.6">LUXE JEWELRY</text>
</svg>