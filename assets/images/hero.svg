<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1"/>
      <stop offset="50%" style="stop-color:#16213e;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#0f3460;stop-opacity:1"/>
    </linearGradient>
    <radialGradient id="glow1" cx="30%" cy="40%" r="50%">
      <stop offset="0%" style="stop-color:#e2b04a;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#e2b04a;stop-opacity:0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="70%" cy="60%" r="40%">
      <stop offset="0%" style="stop-color:#c9a96e;stop-opacity:0.1"/>
      <stop offset="100%" style="stop-color:#c9a96e;stop-opacity:0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0d78c"/>
      <stop offset="30%" style="stop-color:#e2b04a"/>
      <stop offset="50%" style="stop-color:#f7e8b0"/>
      <stop offset="70%" style="stop-color:#d4a017"/>
      <stop offset="100%" style="stop-color:#c9970a"/>
    </linearGradient>
    <linearGradient id="goldLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f7e8b0"/>
      <stop offset="100%" style="stop-color:#e2b04a"/>
    </linearGradient>
    <radialGradient id="diamond" cx="40%" cy="35%" r="55%">
      <stop offset="0%" style="stop-color:#ffffff"/>
      <stop offset="25%" style="stop-color:#f0f4ff"/>
      <stop offset="50%" style="stop-color:#d4e4ff"/>
      <stop offset="75%" style="stop-color:#a0c0e8"/>
      <stop offset="100%" style="stop-color:#6080a0"/>
    </radialGradient>
    <radialGradient id="pearl" cx="40%" cy="35%" r="55%">
      <stop offset="0%" style="stop-color:#ffffff"/>
      <stop offset="30%" style="stop-color:#f5f0f0"/>
      <stop offset="60%" style="stop-color:#e8ddd5"/>
      <stop offset="80%" style="stop-color:#d4c5b9"/>
      <stop offset="100%" style="stop-color:#b8a99a"/>
    </radialGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.3"/></filter>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1920" height="1080" fill="url(#bg)"/>
  <rect width="1920" height="1080" fill="url(#glow1)"/>
  <rect width="1920" height="1080" fill="url(#glow2)"/>
  <circle cx="200" cy="150" r="1.5" fill="#f0d78c" opacity="0.6"><animate attributeName="opacity" values="0.2;0.8;0.2" dur="3s" repeatCount="indefinite"/></circle>
  <circle cx="450" cy="300" r="1" fill="#f7e8b0" opacity="0.4"><animate attributeName="opacity" values="0.1;0.6;0.1" dur="2.5s" repeatCount="indefinite"/></circle>
  <circle cx="800" cy="120" r="1.5" fill="#e2b04a" opacity="0.5"><animate attributeName="opacity" values="0.3;0.9;0.3" dur="4s" repeatCount="indefinite"/></circle>
  <circle cx="1200" cy="200" r="1" fill="#f0d78c" opacity="0.3"><animate attributeName="opacity" values="0.1;0.7;0.1" dur="3.5s" repeatCount="indefinite"/></circle>
  <circle cx="1600" cy="180" r="1.5" fill="#f7e8b0" opacity="0.4"><animate attributeName="opacity" values="0.2;0.6;0.2" dur="2.8s" repeatCount="indefinite"/></circle>
  <circle cx="1700" cy="500" r="1" fill="#e2b04a" opacity="0.3"><animate attributeName="opacity" values="0.1;0.5;0.1" dur="3.2s" repeatCount="indefinite"/></circle>
  <circle cx="300" cy="700" r="1.5" fill="#f0d78c" opacity="0.3"><animate attributeName="opacity" values="0.2;0.7;0.2" dur="3.7s" repeatCount="indefinite"/></circle>
  <circle cx="1000" cy="850" r="1" fill="#f7e8b0" opacity="0.4"><animate attributeName="opacity" values="0.1;0.5;0.1" dur="2.6s" repeatCount="indefinite"/></circle>
  <g transform="translate(960,540)" filter="url(#shadow)">
    <path d="M-120,-80 C-60,-120 60,-120 120,-80" fill="none" stroke="url(#gold)" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M-140,-50 C-70,-90 70,-90 140,-50" fill="none" stroke="url(#goldLight)" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
    <g transform="translate(0,20)" filter="url(#glow)">
      <polygon points="0,-85 35,-45 0,-5 -35,-45" fill="url(#gold)" opacity="0.3"/>
      <polygon points="0,-75 30,-40 0,-5 -30,-40" fill="url(#diamond)" stroke="url(#gold)" stroke-width="1.5"/>
      <circle cx="0" cy="-45" r="4" fill="url(#goldLight)"/>
    </g>
    <g transform="translate(-80,50)">
      <circle cx="0" cy="0" r="12" fill="url(#gold)" opacity="0.2"/>
      <circle cx="0" cy="0" r="9" fill="url(#pearl)" stroke="url(#gold)" stroke-width="1"/>
      <circle cx="0" cy="-4" r="2" fill="white" opacity="0.7"/>
    </g>
    <g transform="translate(80,50)">
      <circle cx="0" cy="0" r="12" fill="url(#gold)" opacity="0.2"/>
      <circle cx="0" cy="0" r="9" fill="url(#pearl)" stroke="url(#gold)" stroke-width="1"/>
      <circle cx="0" cy="-4" r="2" fill="white" opacity="0.7"/>
    </g>
  </g>
</svg>