<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600">
  <defs>
    <linearGradient id="surface" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#faf8f5;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#ede8e0;stop-opacity:1"/>
    </linearGradient>
    <radialGradient id="spotlight" cx="50%" cy="30%" r="60%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.9"/>
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0"/>
    </radialGradient>
    <linearGradient id="roseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f2c4c4"/>
      <stop offset="40%" style="stop-color:#e8a0a0"/>
      <stop offset="60%" style="stop-color:#f0cece"/>
      <stop offset="100%" style="stop-color:#c97c7c"/>
    </linearGradient>
    <radialGradient id="amethystGrad" cx="45%" cy="35%" r="50%">
      <stop offset="0%" style="stop-color:#e8c8ff"/>
      <stop offset="35%" style="stop-color:#9b59b6"/>
      <stop offset="100%" style="stop-color:#4a154b"/>
    </radialGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#000" flood-opacity="0.15"/></filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="600" height="600" fill="url(#surface)"/>
  <rect width="600" height="600" fill="url(#spotlight)"/>
  <g transform="translate(300,275)" filter="url(#shadow)">
    <path d="M-160,-30 C-120,-100 120,-100 160,-30" fill="none" stroke="url(#roseGrad)" stroke-width="1.8" stroke-dasharray="6,5"/>
    <ellipse cx="-140" cy="-20" rx="5" ry="7" fill="url(#amethystGrad)" stroke="url(#roseGrad)" stroke-width="0.5"/>
    <ellipse cx="-110" cy="-50" rx="5" ry="7" fill="url(#amethystGrad)" stroke="url(#roseGrad)" stroke-width="0.5"/>
    <ellipse cx="-80" cy="-70" rx="5" ry="8" fill="url(#amethystGrad)" stroke="url(#roseGrad)" stroke-width="0.5"/>
    <ellipse cx="-50" cy="-82" rx="5" ry="8" fill="url(#amethystGrad)" stroke="url(#roseGrad)" stroke-width="0.5"/>
    <ellipse cx="-20" cy="-88" rx="5" ry="8" fill="url(#amethystGrad)" stroke="url(#roseGrad)" stroke-width="0.5"/>
    <ellipse cx="20" cy="-88" rx="5" ry="8" fill="url(#amethystGrad)" stroke="url(#roseGrad)" stroke-width="0.5"/>
    <ellipse cx="50" cy="-82" rx="5" ry="8" fill="url(#amethystGrad)" stroke="url(#roseGrad)" stroke-width="0.5"/>
    <ellipse cx="80" cy="-70" rx="5" ry="8" fill="url(#amethystGrad)" stroke="url(#roseGrad)" stroke-width="0.5"/>
    <ellipse cx="110" cy="-50" rx="5" ry="7" fill="url(#amethystGrad)" stroke="url(#roseGrad)" stroke-width="0.5"/>
    <ellipse cx="140" cy="-20" rx="5" ry="7" fill="url(#amethystGrad)" stroke="url(#roseGrad)" stroke-width="0.5"/>
    <g transform="translate(0,10)" filter="url(#softGlow)">
      <polygon points="0,-45 20,-15 0,20 -20,-15" fill="url(#amethystGrad)" stroke="url(#roseGrad)" stroke-width="1.5"/>
      <polygon points="0,-38 14,-14 0,12 -14,-14" fill="white" opacity="0.2"/>
      <polygon points="-4,-10 6,-4 0,5 -8,-6" fill="white" opacity="0.1"/>
    </g>
  </g>
  <text x="300" y="560" text-anchor="middle" font-family="Georgia,serif" font-size="14" fill="#d4c5b9" letter-spacing="8" opacity="0.6">LUXE JEWELRY</text>
</svg>