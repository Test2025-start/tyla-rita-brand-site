<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600">
  <defs>
    <linearGradient id="surface" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#faf8f5;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#ede8e0;stop-opacity:1"/>
    </linearGradient>
    <radialGradient id="spotlight" cx="50%" cy="30%" r="60%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.9"/>
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0"/>
    </radialGradient>
    <linearGradient id="roseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f2c4c4"/>
      <stop offset="40%" style="stop-color:#e8a0a0"/>
      <stop offset="60%" style="stop-color:#f0cece"/>
      <stop offset="100%" style="stop-color:#c97c7c"/>
    </linearGradient>
    <radialGradient id="diamondGrad" cx="40%" cy="35%" r="55%">
      <stop offset="0%" style="stop-color:#ffffff"/>
      <stop offset="25%" style="stop-color:#f0f4ff"/>
      <stop offset="50%" style="stop-color:#d4e4ff"/>
      <stop offset="75%" style="stop-color:#a0c0e8"/>
      <stop offset="100%" style="stop-color:#6080a0"/>
    </radialGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#000" flood-opacity="0.15"/></filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="600" height="600" fill="url(#surface)"/>
  <rect width="600" height="600" fill="url(#spotlight)"/>
  <g transform="translate(300,250)" filter="url(#shadow)">
    <ellipse cx="0" cy="55" rx="50" ry="60" fill="none" stroke="url(#roseGrad)" stroke-width="6" stroke-linecap="round"/>
    <ellipse cx="0" cy="53" rx="46" ry="56" fill="none" stroke="#f0cece" stroke-width="1" opacity="0.5"/>
    <g transform="translate(0,-15)">
      <ellipse cx="0" cy="-18" rx="10" ry="14" fill="url(#roseGrad)" opacity="0.7"/>
      <ellipse cx="16" cy="-6" rx="10" ry="14" fill="url(#roseGrad)" opacity="0.7" transform="rotate(72)"/>
      <ellipse cx="10" cy="14" rx="10" ry="14" fill="url(#roseGrad)" opacity="0.7" transform="rotate(144)"/>
      <ellipse cx="-10" cy="14" rx="10" ry="14" fill="url(#roseGrad)" opacity="0.7" transform="rotate(216)"/>
      <ellipse cx="-16" cy="-6" rx="10" ry="14" fill="url(#roseGrad)" opacity="0.7" transform="rotate(288)"/>
      <circle cx="0" cy="0" r="9" fill="url(#diamondGrad)" stroke="url(#roseGrad)" stroke-width="1"/>
      <circle cx="-3" cy="-3" r="3" fill="white" opacity="0.4"/>
    </g>
  </g>
  <text x="300" y="560" text-anchor="middle" font-family="Georgia,serif" font-size="14" fill="#d4c5b9" letter-spacing="8" opacity="0.6">LUXE JEWELRY</text>
</svg>