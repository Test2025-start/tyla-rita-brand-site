<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<meta name="robots" content="noindex">
<title>管理后台 — Site Admin</title>
<style>
/* ========== 基础变量 ========== */
:root{--primary:#C9A96E;--primary-dark:#B08D4A;--bg:#F8F6F3;--white:#FFF;--text:#2D2D2D;--text-light:#888;--border:#E5E0D8;--danger:#E74C3C;--success:#27AE60;--radius:8px}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);-webkit-tap-highlight-color:transparent}

/* ========== 登录页 ========== */
#loginPage{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
.login-box{background:var(--white);border:1px solid var(--border);border-radius:12px;padding:40px;width:100%;max-width:380px;box-shadow:0 4px 24px rgba(0,0,0,.06)}
.login-box h1{font-size:22px;text-align:center;margin-bottom:4px}
.login-box .sub{font-size:13px;color:#999;text-align:center;margin-bottom:28px}
.fg{margin-bottom:14px}
.fg label{display:block;font-size:14px;font-weight:500;margin-bottom:5px;color:#555}
.fg .lh{font-size:11px;color:var(--primary);font-weight:600;margin-bottom:2px}
.fi{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:6px;font-size:15px;background:var(--white);-webkit-appearance:none}
.fi:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 2px rgba(201,169,110,.15)}
textarea.fi{resize:vertical;min-height:70px}
.fr{display:flex;gap:12px}.fr .fg{flex:1}
.cr{display:flex;gap:8px;align-items:center}
.cr input[type=color]{width:36px;height:36px;border:1px solid var(--border);border-radius:6px;cursor:pointer;padding:2px}
.chk{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.chk input[type=checkbox]{width:18px;height:18px;accent-color:var(--primary)}
.btn{display:inline-block;padding:10px 20px;border:none;border-radius:6px;font-size:14px;cursor:pointer;font-weight:500;transition:.15s;text-decoration:none;touch-action:manipulation}
.btn-p{background:var(--primary);color:#FFF}.btn-p:hover{background:var(--primary-dark)}
.btn-d{background:var(--danger);color:#FFF}.btn-s{background:var(--success);color:#FFF}
.btn-o{background:white;border:1px solid var(--border);color:var(--text)}.btn-o:hover{border-color:var(--primary);color:var(--primary)}
.btn-sm{padding:6px 12px;font-size:12px}
.btn-block{display:block;width:100%;text-align:center}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-login{width:100%;padding:12px;background:var(--primary);color:#FFF;border:none;border-radius:6px;font-size:16px;font-weight:600;cursor:pointer;margin-top:8px}
.btn-login:hover{background:var(--primary-dark)}
.alert{padding:10px 14px;border-radius:6px;font-size:13px;margin-bottom:14px;display:none}
.alert.show{display:block;animation:fadeIn .3s}
.alert-e{background:#FDECEA;color:var(--danger);border:1px solid #FADBD8}
.alert-s{background:#E8F8F5;color:var(--success);border:1px solid #D5F5E3}
@keyframes fadeIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:translateY(0)}}

/* ========== Toast 浮动提示 ========== */
#toastContainer{position:fixed;top:16px;right:16px;z-index:9999;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{pointer-events:auto;padding:12px 20px;border-radius:8px;font-size:14px;font-weight:500;color:#FFF;box-shadow:0 6px 24px rgba(0,0,0,.15);animation:toastIn .35s ease;max-width:340px;line-height:1.4}
.toast-success{background:linear-gradient(135deg,#27AE60,#2ECC71)}
.toast-error{background:linear-gradient(135deg,#E74C3C,#EC7063)}
.toast-info{background:linear-gradient(135deg,#3498DB,#5DADE2)}
@keyframes toastIn{from{opacity:0;transform:translateX(60px)}to{opacity:1;transform:translateX(0)}}
@keyframes toastOut{from{opacity:1;transform:translateX(0)}to{opacity:0;transform:translateX(60px)}}

/* ========== 图片上传组件 ========== */
.img-upload-wrap{display:flex;align-items:center;gap:8px}
.img-upload-wrap .fi{flex:1}
.img-up-btn{display:inline-flex;align-items:center;gap:4px;padding:9px 14px;background:#F5F0EB;border:1px dashed #C9A96E;border-radius:6px;color:var(--primary-dark);font-size:13px;font-weight:500;cursor:pointer;transition:.15s;white-space:nowrap;flex-shrink:0}
.img-up-btn:hover{background:#EDE5DA}
.img-up-btn input{display:none}
.img-preview{margin-top:6px;display:none}
.img-preview.show{display:block}
.img-preview img{max-width:120px;max-height:80px;border-radius:6px;border:1px solid var(--border);object-fit:cover}
.img-preview .img-rm{display:inline-block;margin-left:8px;font-size:12px;color:var(--danger);cursor:pointer;text-decoration:none}

/* ========== 未发布横幅 ========== */
.dirty-banner{background:linear-gradient(135deg,#FFF3CD,#FFE69C);color:#856404;padding:12px 20px;border-radius:8px;margin-bottom:16px;font-size:14px;font-weight:500;display:flex;align-items:center;justify-content:space-between;gap:12px;border:1px solid #FFE69C;animation:fadeIn .3s}
.dirty-banner .db-text{flex:1}
.dirty-banner .db-btn{padding:6px 16px;background:var(--primary);color:#FFF;border:none;border-radius:6px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
.dirty-banner .db-btn:hover{background:var(--primary-dark)}

/* ========== 上传进度 ========== */
.upload-progress{margin-top:8px;padding:10px;background:#F8F6F3;border-radius:6px;font-size:13px;color:#888}
.upload-progress .up-bar{height:4px;background:#EEE;border-radius:2px;overflow:hidden;margin-top:6px}
.upload-progress .up-fill{height:100%;background:linear-gradient(90deg,var(--primary),var(--primary-dark));border-radius:2px;transition:width .3s}

/* ========== 批量上传 ========== */
.batch-upload-area{border:2px dashed var(--border);border-radius:12px;padding:32px;text-align:center;cursor:pointer;transition:.2s;margin-bottom:16px;background:#FAFAFA}
.batch-upload-area:hover,.batch-upload-area.dragover{border-color:var(--primary);background:#FDFBF7}
.batch-upload-area .bu-icon{font-size:48px;margin-bottom:12px}
.batch-upload-area .bu-text{font-size:15px;color:var(--text);margin-bottom:4px}
.batch-upload-area .bu-hint{font-size:12px;color:#999}
.batch-upload-panel{background:var(--white);border:1px solid var(--border);border-radius:8px;padding:16px;margin-bottom:16px}
.batch-upload-panel .bup-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.batch-upload-panel .bup-header h4{font-size:15px;font-weight:600}
.batch-upload-item{display:flex;align-items:center;gap:12px;padding:10px;border:1px solid var(--border);border-radius:6px;margin-bottom:8px}
.batch-upload-item img{width:48px;height:48px;object-fit:cover;border-radius:4px;background:#f0f0f0}
.batch-upload-item .bui-info{flex:1;min-width:0}
.batch-upload-item .bui-name{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.batch-upload-item .bui-size{font-size:11px;color:#999}
.batch-upload-item .bui-status{font-size:12px;font-weight:500}
.batch-upload-item .bui-status.success{color:var(--success)}
.batch-upload-item .bui-status.error{color:var(--danger)}
.batch-upload-item .bui-status.uploading{color:var(--primary)}
.batch-upload-item .bui-bar{height:3px;background:#EEE;border-radius:2px;overflow:hidden;margin-top:4px}
.batch-upload-item .bui-bar-fill{height:100%;background:var(--primary);border-radius:2px;transition:width .2s}
.batch-summary{padding:12px;background:#F8F6F3;border-radius:6px;font-size:13px;margin-top:12px}
.batch-summary .bs-success{color:var(--success);font-weight:600}
.batch-summary .bs-error{color:var(--danger);font-weight:600}
.btn-batch{display:inline-flex;align-items:center;gap:6px;padding:10px 20px;background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:#FFF;border:none;border-radius:6px;font-size:14px;font-weight:600;cursor:pointer;transition:.15s}
.btn-batch:hover{opacity:.9}
.btn-batch:disabled{opacity:.5;cursor:not-allowed}

/* ========== 桌面布局 ========== */
#app{display:none;min-height:100vh}
.topbar{display:none;position:fixed;top:0;left:0;right:0;z-index:200;background:#1E1E1E;color:#FFF;padding:12px 16px;align-items:center;justify-content:space-between}
.topbar .tb-logo{font-size:16px;font-weight:700;color:var(--primary)}
.topbar .tb-menu{background:none;border:none;color:#FFF;font-size:24px;cursor:pointer;padding:4px 8px;line-height:1}
.sidebar{width:220px;background:#1E1E1E;color:#CCC;position:fixed;top:0;left:0;bottom:0;z-index:100;display:flex;flex-direction:column;transition:transform .25s}
.sidebar-logo{padding:24px 20px 16px;font-size:18px;font-weight:700;color:var(--primary);border-bottom:1px solid #333}
.sidebar-info{padding:10px 20px;font-size:12px;color:#888;border-bottom:1px solid #333}
.sidebar-info .role{color:var(--primary);font-size:11px;margin-top:2px}
.sidebar-nav{flex:1;padding:8px 0;overflow-y:auto}
.sidebar-nav a{display:block;padding:12px 20px;color:#AAA;text-decoration:none;font-size:14px;border-left:3px solid transparent;cursor:pointer;transition:.15s}
.sidebar-nav a:hover,.sidebar-nav a.active{color:#FFF;background:#2A2A2A;border-left-color:var(--primary)}
.sidebar-nav .sec{padding:12px 20px 4px;font-size:11px;color:#666;text-transform:uppercase;letter-spacing:2px}
.sidebar-footer{padding:16px 20px;border-top:1px solid #333}
.sidebar-footer a{color:#888;font-size:13px;text-decoration:none;cursor:pointer}
.sidebar-footer a:hover{color:#FFF}
.sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:99}
.main{margin-left:220px;flex:1;padding:28px 36px;max-width:960px}
.page-title{font-size:22px;font-weight:600;margin-bottom:20px}
.card{background:var(--white);border:1px solid var(--border);border-radius:var(--radius);padding:20px 24px;margin-bottom:18px}
.card-title{font-size:15px;font-weight:600;margin-bottom:14px;padding-bottom:10px;border-bottom:1px solid var(--border)}
.tag{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600}
.tag-admin{background:#FDEBD0;color:#B9770E}.tag-editor{background:#D5F5E3;color:#1E8449}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:20px}
.stat-card{background:var(--white);border:1px solid var(--border);border-radius:var(--radius);padding:18px;text-align:center}
.stat-card .num{font-size:28px;font-weight:700;color:var(--primary)}
.stat-card .lbl{font-size:12px;color:var(--text-light);margin-top:4px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;padding:8px 10px;border-bottom:2px solid var(--border);font-weight:600;color:#555;font-size:11px;text-transform:uppercase}
td{padding:8px 10px;border-bottom:1px solid var(--border);vertical-align:middle}
tr:hover td{background:#FAFAFA}
.empty{text-align:center;padding:32px;color:var(--text-light)}
.status{margin-top:14px;font-size:13px;line-height:1.6}
.s-e{color:var(--danger)}.s-s{color:var(--success)}.s-w{color:#E67E22}
.depoly-actions{display:flex;flex-wrap:wrap;gap:10px}

/* ========== 仪表盘专用样式 ========== */
.dash-welcome{background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:#FFF;border-radius:12px;padding:28px 30px;margin-bottom:20px;position:relative;overflow:hidden}
.dash-welcome::after{content:'';position:absolute;top:-30px;right:-20px;width:120px;height:120px;background:rgba(255,255,255,.08);border-radius:50%}
.dash-welcome h2{font-size:22px;margin-bottom:6px}
.dash-welcome p{font-size:13px;opacity:.85}
.dash-welcome .site-link{display:inline-block;margin-top:10px;padding:6px 16px;background:rgba(255,255,255,.2);border-radius:20px;color:#FFF;font-size:12px;text-decoration:none;transition:.15s}
.dash-welcome .site-link:hover{background:rgba(255,255,255,.3)}

.guide-steps{counter-reset:step}
.guide-step{display:flex;gap:14px;align-items:flex-start;padding:14px 0;border-bottom:1px solid var(--border);counter-increment:step}
.guide-step:last-child{border-bottom:none}
.guide-num{flex-shrink:0;width:32px;height:32px;background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:#FFF;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700}
.guide-num::before{content:counter(step)}
.guide-body{flex:1}
.guide-body .gt{font-size:14px;font-weight:600;margin-bottom:2px}
.guide-body .gd{font-size:12px;color:var(--text-light);line-height:1.5}
.guide-body .gb{display:inline-block;margin-top:6px;padding:4px 12px;background:var(--primary);color:#FFF;border-radius:4px;font-size:12px;text-decoration:none;cursor:pointer;transition:.15s}
.guide-body .gb:hover{background:var(--primary-dark)}

.progress-bar{height:8px;background:#EEE;border-radius:4px;overflow:hidden;margin:8px 0 4px}
.progress-fill{height:100%;border-radius:4px;background:linear-gradient(90deg,var(--primary),var(--primary-dark));transition:width .5s ease}

.quick-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.quick-item{display:flex;align-items:center;gap:10px;padding:14px 16px;background:#FAFAFA;border:1px solid var(--border);border-radius:8px;cursor:pointer;transition:.15s;text-decoration:none;color:var(--text)}
.quick-item:hover{border-color:var(--primary);background:#FDFBF7}
.quick-item .qi-icon{font-size:24px;flex-shrink:0}
.quick-item .qi-text{font-size:13px;font-weight:500}
.quick-item .qi-sub{font-size:11px;color:var(--text-light)}

/* ========== 移动端适配 (<768px) ========== */
@media(max-width:768px){
  .login-box{padding:28px 20px}
  .topbar{display:flex}
  .sidebar{transform:translateX(-100%);width:260px;padding-top:52px;z-index:150}
  .sidebar.open{transform:translateX(0)}
  .sidebar-overlay.show{display:block}
  .sidebar-logo{display:none}
  .main{margin-left:0;padding:60px 16px 24px;max-width:100%}
  .main .card{padding:16px;margin-bottom:12px}
  .page-title{font-size:18px;margin-bottom:14px}
  .fr{flex-direction:column;gap:0}
  .stats{grid-template-columns:1fr;gap:10px}
  .stat-card{padding:14px}
  .stat-card .num{font-size:22px}
  .fi{font-size:16px;padding:11px 12px}
  .btn{padding:12px 20px;font-size:15px}
  .btn-sm{padding:7px 14px;font-size:13px}
  .depoly-actions .btn{width:100%}
  th,td{font-size:12px;padding:6px 8px}
  table{display:block;overflow-x:auto;-webkit-overflow-scrolling:touch}
  select.fi{font-size:16px}
  #toastContainer{top:auto;bottom:16px;right:16px;left:16px}
  .toast{max-width:100%}
  .dash-welcome{padding:20px}
  .dash-welcome h2{font-size:18px}
  .quick-grid{grid-template-columns:1fr}
  .img-upload-wrap{flex-direction:column;align-items:stretch}
  .img-up-btn{justify-content:center}
}
</style>
</head>
<body>

<!-- ===== Toast 容器 ===== -->
<div id="toastContainer"></div>

<!-- ===== 登录页 ===== -->
<div id="loginPage">
  <div class="login-box">
    <h1>⚡ 管理后台</h1>
    <p class="sub">营销网站配置 & 一键部署</p>
    <div class="alert" id="loginAlert"></div>
    <div class="fg"><label>用户名</label><input type="text" id="loginUser" class="fi" placeholder="输入用户名" autofocus autocomplete="username"></div>
    <div class="fg"><label>密码</label><input type="password" id="loginPass" class="fi" placeholder="输入密码" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()"></div>
    <button class="btn-login" id="loginBtn" onclick="doLogin()">登 录</button>
    <p style="text-align:center;font-size:12px;color:#BBB;margin-top:16px">默认: admin / admin123</p>
  </div>
</div>

<!-- ===== 主应用 ===== -->
<div id="app">
  <!-- 移动端顶栏 -->
  <div class="topbar" id="topbar">
    <button class="tb-menu" onclick="toggleSidebar()" aria-label="菜单">☰</button>
    <span class="tb-logo">⚡ Site Admin</span>
    <span style="font-size:12px;color:#888" id="tbUser"></span>
  </div>

  <!-- 遮罩 -->
  <div class="sidebar-overlay" id="overlay" onclick="toggleSidebar()"></div>

  <!-- 侧边栏 -->
  <nav class="sidebar" id="sidebar">
    <div class="sidebar-logo">⚡ Site Admin</div>
    <div class="sidebar-info"><span id="sUser"></span><div class="role" id="sRole"></div></div>
    <div class="sidebar-nav">
      <a class="active" data-page="dashboard">📊 仪表盘</a>
      <div class="sec">内容配置</div>
      <a data-page="brand">🏷️ 品牌设置</a>
      <a data-page="products">🛍️ 产品管理</a>
      <a data-page="pages">📄 页面内容</a>
      <a data-page="contact">📞 联系方式</a>
      <div class="sec">发布</div>
      <a data-page="deploy">🚀 生成 & 部署</a>
      <div class="sec" id="adminSec" style="display:none">管理</div>
      <a data-page="users" id="navUsers" style="display:none">👥 用户管理</a>
    </div>
    <div class="sidebar-footer"><a onclick="doLogout()">退出登录 →</a></div>
  </nav>

  <main class="main">
    <div class="alert" id="mainAlert"></div>
    <div id="pageContainer"></div>
  </main>
</div>

<script>
// =================== 全局函数 ===================
async function sha256(m){const e=new TextEncoder().encode(m);const h=await crypto.subtle.digest('SHA-256',e);return Array.from(new Uint8Array(h)).map(b=>b.toString(16).padStart(2,'0')).join('')}
function $(id){return document.getElementById(id)}
function qsa(sel){return document.querySelectorAll(sel)}
function showAlert(elId, msg, type){const e=$(elId);e.textContent=msg;e.className='alert alert-'+type+' show';setTimeout(()=>e.classList.remove('show'),4000)}

// =================== Toast 浮动提示 ===================
function toast(msg,type){type=type||'success';
  const c=$('toastContainer');
  const el=document.createElement('div');
  el.className='toast toast-'+type;
  const icon={success:'✅',error:'❌',info:'ℹ️'}[type]||'✅';
  el.innerHTML=`<span>${icon}</span> ${msg}`;
  c.appendChild(el);
  setTimeout(()=>{el.style.animation='toastOut .3s ease forwards';setTimeout(()=>el.remove(),300)},2500);
}

// =================== 移动端侧边栏 ===================
function toggleSidebar(){
  const sb=$('sidebar'),ov=$('overlay');
  sb.classList.toggle('open');ov.classList.toggle('show');
}
function closeSidebar(){
  $('sidebar').classList.remove('open');$('overlay').classList.remove('show');
}

// =================== 配置 ===================
const DEFAULT_CONFIG={
  i18n:{defaultLanguage:"en",languages:["en","zh"]},
  brand:{name:{en:"Your Brand",zh:"您的品牌"},slogan:{en:"Everyday Elegance",zh:"优雅每一天"},logo:"",primaryColor:"#C9A96E",secondaryColor:"#2D2D2D",bgColor:"#FFFFFF",accentBg:"#FAF8F5"},
  navigation:[{id:"home",label:{en:"Home",zh:"首页"},href:"#home"},{id:"products",label:{en:"Products",zh:"产品"},href:"#products"},{id:"about",label:{en:"About",zh:"关于"},href:"#about"},{id:"contact",label:{en:"Contact",zh:"联系"},href:"#contact"}],
  hero:{image:"",title:{en:"Your Brand",zh:"您的品牌"},subtitle:{en:"Everyday Elegance",zh:"优雅每一天"},ctaText:{en:"Explore Collection",zh:"探索产品"},ctaLink:"#products"},
  productsMeta:{title:{en:"Our Products",zh:"我们的产品"}},
  productCategories:[{en:"All",zh:"全部"},{en:"New Arrivals",zh:"新品上市"},{en:"Best Sellers",zh:"热销推荐"},{en:"Classic",zh:"经典系列"}],
  products:[{name:{en:"Freshwater Pearl Necklace",zh:"淡水珍珠项链"},category:{en:"Best Sellers",zh:"热销推荐"},price:"$29.00",image:"",description:{en:"Elegant freshwater pearls.",zh:"优雅淡水珍珠"}}],
  about:{image:"",title:{en:"About Us",zh:"关于我们"},paragraphs:[{en:"Our brand was born from a passion for beauty.",zh:"我们的品牌始于对美的追求。"},{en:"Every piece is carefully selected.",zh:"每一件产品都经过精心挑选。"}]},

var IMG_MAX_WIDTH=1200,IMG_JPEG_QUALITY=0.7,IMG_MAX_SIZE_NO_IMGBB=200*1024;

function compressImage(file,maxWidth,quality){
  maxWidth=maxWidth||IMG_MAX_WIDTH;quality=quality||IMG_JPEG_QUALITY;
  return new Promise(function(resolve,reject){
    var img=new Image();
    var url=URL.createObjectURL(file);
    img.onload=function(){
      URL.revokeObjectURL(url);
      var w=img.width,h=img.height;
      if(w>maxWidth){h=Math.round(h*maxWidth/w);w=maxWidth;}
      if(h>maxWidth){w=Math.round(w*maxWidth/h);h=maxWidth;}
      var canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;
      canvas.getContext('2d').drawImage(img,0,0,w,h);
      canvas.toBlob(function(blob){blob?resolve(blob):reject(new Error('压缩失败'))},file.type==='image/png'?'image/png':'image/jpeg',quality);
    };
    img.onerror=function(){URL.revokeObjectURL(url);reject(new Error('图片加载失败'));};
    img.src=url;
  });
}

function formatFileSize(bytes){
  if(bytes<1024)return bytes+'B';
  if(bytes<1024*1024)return (bytes/1024).toFixed(1)+'KB';
  return (bytes/(1024*1024)).toFixed(1)+'MB';
}

function imgField(id,label,val){

}

function handleUpload(inp,targetId){
  var f=inp.files[0];if(!f)return;
  var preview=$(targetId+'_preview');
  preview.innerHTML='<div class="upload-progress" id="'+targetId+'_prog"><span>⏳ 准备上传...</span><div class="up-bar"><div class="up-fill" style="width:0%"></div></div></div>';
  preview.classList.add('show');

  if(imgbbKey){
    // ImgBB CDN 直传（保留原图质量）
    compressImage(f,99999,0.95).then(function(blob){
      var form=new FormData();form.append('image',blob||f);
      var xhr=new XMLHttpRequest();
      xhr.open('POST','https://api.imgbb.com/1/image?key='+imgbbKey);
      xhr.upload.addEventListener('progress',function(e){
        if(e.lengthComputable){
          var pct=Math.round(e.loaded/e.total*100);
          var pg=$(targetId+'_prog');
          if(pg){pg.querySelector('span').textContent='上传中... '+pct+'%';pg.querySelector('.up-fill').style.width=pct+'%';}
        }
      });
      xhr.addEventListener('load',function(){
        if(xhr.status===200){
          try{
            var d=JSON.parse(xhr.responseText);
            if(d&&d.data&&d.data.url){
              $(targetId).value=d.data.url;
              preview.innerHTML='<img src="'+esc(d.data.url)+'" alt="preview"><a class="img-rm" href="javascript:void(0)" onclick="clearImg(\''+targetId+'\')">移除</a>';
              toast('✅ 图片已上传至图床','success');markDirty();
            }else{toast('❌ ImgBB返回数据格式错误','error');preview.innerHTML='';preview.classList.remove('show');}
          }catch(e){toast('❌ 解析ImgBB响应失败','error');preview.innerHTML='';preview.classList.remove('show');}
        }else{
          var errMsg='上传失败';
          try{var rd=JSON.parse(xhr.responseText);if(rd&&rd.error)errMsg=rd.error.message||rd.error;}catch(e2){}
          toast('❌ ImgBB上传失败: '+errMsg,'error');
          preview.innerHTML='';preview.classList.remove('show');
        }
      });
      xhr.addEventListener('error',function(){toast('❌ 网络错误，请检查网络连接','error');preview.innerHTML='';preview.classList.remove('show');});
      xhr.send(form);
    }).catch(function(e){toast('❌ '+e.message,'error');preview.innerHTML='';preview.classList.remove('show');});
  }else{
    // 无 ImgBB Key → 压缩后 base64 内联
    var pg=$(targetId+'_prog');
    if(pg)pg.querySelector('span').textContent='⏳ 正在压缩图片...';
    compressImage(f,IMG_MAX_WIDTH,IMG_JPEG_QUALITY).then(function(blob){
      if(blob.size>IMG_MAX_SIZE_NO_IMGBB){
        toast('⚠️ 压缩后仍有'+formatFileSize(blob.size)+'，建议配置ImgBB Key上传高清图片','info');
      }
      if(blob.size>5*1024*1024){
        toast('❌ 图片超过5MB，无法使用本地模式','error');preview.innerHTML='';preview.classList.remove('show');return;
      }
      if(pg){pg.querySelector('span').textContent='⏳ 正在保存...';pg.querySelector('.up-fill').style.width='80%';}
      var r=new FileReader();
      r.onload=function(){
        $(targetId).value=r.result;
        preview.innerHTML='<img src="'+esc(r.result)+'" alt="preview"><a class="img-rm" href="javascript:void(0)" onclick="clearImg(\''+targetId+'\')">移除</a>';
        toast('✅ 图片已保存（本地模式，'+formatFileSize(blob.size)+'）','success');markDirty();
      };
      r.readAsDataURL(blob);
    }).catch(function(e){
      // 压缩失败时回退到原图
      if(f.size>5*1024*1024){toast('❌ 图片过大且压缩失败','error');preview.innerHTML='';preview.classList.remove('show');return;}
      var r2=new FileReader();
      r2.onload=function(){
        $(targetId).value=r2.result;
        preview.innerHTML='<img src="'+esc(r2.result)+'" alt="preview"><a class="img-rm" href="javascript:void(0)" onclick="clearImg(\''+targetId+'\')">移除</a>';
        toast('✅ 图片已保存（未压缩，'+formatFileSize(f.size)+'）','info');markDirty();
      };
      r2.readAsDataURL(f);
    });
  }
}

// =================== 批量上传系统 ===================
var batchUploadQueue=[];var batchUploadActive=0;var batchUploadMaxConcurrent=5;var batchUploadCancelled=false;

function renderBatchUploadArea(callbackId){
  return `<div class="batch-upload-area" id="batchArea_${callbackId}" ondragover="event.preventDefault();this.classList.add('dragover')" ondragleave="this.classList.remove('dragover')" ondrop="handleBatchDrop(event,'${callbackId}')" onclick="document.getElementById('batchInput_${callbackId}').click()">
    <div class="bu-icon">📸</div>
    <div class="bu-text">点击或拖拽图片到这里批量上传</div>
    <div class="bu-hint">支持 JPG/PNG/GIF/WebP，最多同时上传 20 张</div>
    <input type="file" id="batchInput_${callbackId}" accept="image/*" multiple style="display:none" onchange="handleBatchSelect(this,'${callbackId}')">
  </div><div id="batchPanel_${callbackId}"></div>`;
}

function handleBatchDrop(e,callbackId){
  e.preventDefault();e.stopPropagation();
  var area=$('batchArea_'+callbackId);
  if(area)area.classList.remove('dragover');
  var files=Array.from(e.dataTransfer.files).filter(f=>f.type.startsWith('image/'));
  if(files.length)startBatchUpload(files,callbackId);
}

function handleBatchSelect(inp,callbackId){
  var files=Array.from(inp.files).filter(f=>f.type.startsWith('image/'));
  if(files.length)startBatchUpload(files,callbackId);
  inp.value='';
}

function startBatchUpload(files,callbackId){
  if(files.length>20){toast('❌ 最多同时上传20张图片','error');return;}
  // 显示当前上传模式
  if(imgbbKey&&imgbbKey.trim()){
    console.log('批量上传模式: ImgBB CDN (Key: '+imgbbKey.trim().substring(0,8)+'...)');
  }else{
    console.log('批量上传模式: base64 本地模式（无 ImgBB Key）');
    toast('ℹ️ 使用本地模式上传（建议配置 ImgBB Key 上传高清图片）','info');
  }
  batchUploadCancelled=false;
  batchUploadQueue=files.map((f,i)=>({file:f,id:i,status:'pending',progress:0,url:'',error:''}));
  batchUploadActive=0;
  renderBatchPanel(callbackId);
  processBatchQueue(callbackId);
}

function renderBatchPanel(callbackId){
  var panel=$('batchPanel_'+callbackId);
  if(!panel)return;
  var html='<div class="batch-upload-panel"><div class="bup-header"><h4>📸 批量上传 ('+batchUploadQueue.length+' 张)</h4>';
  html+='<button class="btn btn-o btn-sm" onclick="cancelBatchUpload()">取消</button></div>';
  batchUploadQueue.forEach(function(item){
    var statusClass=item.status==='success'?'success':item.status==='error'?'error':item.status==='uploading'?'uploading':'';
    var statusText=item.status==='pending'?'等待中':item.status==='uploading'?'上传中 '+item.progress+'%':item.status==='success'?'✅ 成功':item.status==='error'?'❌ '+item.error:'';
    html+='<div class="batch-upload-item">';
    if(item.url)html+='<img src="'+esc(item.url)+'" alt="preview">';
    else html+='<div style="width:48px;height:48px;background:#f0f0f0;border-radius:4px;display:flex;align-items:center;justify-content:center">📷</div>';
    html+='<div class="bui-info"><div class="bui-name">'+esc(item.file.name)+'</div><div class="bui-size">'+formatFileSize(item.file.size)+'</div>';
    if(item.status==='uploading')html+='<div class="bui-bar"><div class="bui-bar-fill" style="width:'+item.progress+'%"></div></div>';
    html+='</div><div class="bui-status '+statusClass+'">'+statusText+'</div>';
    if(item.status==='error')html+='<button class="btn btn-o btn-sm" onclick="retryBatchItem('+item.id+','+callbackId+')">重试</button>';
    html+='</div>';
  });
  var successCount=batchUploadQueue.filter(i=>i.status==='success').length;
  var errorCount=batchUploadQueue.filter(i=>i.status==='error').length;
  var doneCount=successCount+errorCount;
  if(doneCount===batchUploadQueue.length){
    html+='<div class="batch-summary">上传完成：<span class="bs-success">成功 '+successCount+' 张</span>';
    if(errorCount)html+='，<span class="bs-error">失败 '+errorCount+' 张</span>';
    html+='</div>';
    if(successCount>0){
      html+='<div style="margin-top:12px"><button class="btn btn-p" onclick="showBatchProductCreator()">🛍️ 从已上传图片批量创建产品</button></div>';
    }
  }
  html+='</div>';
  panel.innerHTML=html;
}

function processBatchQueue(callbackId){
  if(batchUploadCancelled)return;
  while(batchUploadActive<batchUploadMaxConcurrent){
    var next=batchUploadQueue.find(i=>i.status==='pending');
    if(!next)break;
    next.status='uploading';
    batchUploadActive++;
    uploadBatchItem(next,callbackId);
  }
  renderBatchPanel(callbackId);
}

function uploadBatchItem(item,callbackId){
  var file=item.file;
  var doUpload=function(blob){
    var useBlob=blob||file;
    // 有 ImgBB Key 时直传 CDN
    if(imgbbKey&&imgbbKey.trim()){
      var form=new FormData();form.append('image',useBlob);
      var xhr=new XMLHttpRequest();
      xhr.open('POST','https://api.imgbb.com/1/image?key='+imgbbKey.trim());
      xhr.upload.addEventListener('progress',function(e){
        if(e.lengthComputable){item.progress=Math.round(e.loaded/e.total*100);renderBatchPanel(callbackId);}
      });
      xhr.addEventListener('load',function(){
        if(xhr.status===200){
          try{var d=JSON.parse(xhr.responseText);if(d&&d.data&&d.data.url){item.url=d.data.url;item.status='success';}else{item.status='error';item.error='格式错误';}}catch(e){item.status='error';item.error='解析失败';}
          batchUploadActive--;renderBatchPanel(callbackId);processBatchQueue(callbackId);
        }else if(xhr.status===400||xhr.status===403){
          // ImgBB Key 无效，自动降级到 base64
          console.warn('ImgBB 上传失败(HTTP '+xhr.status+')，自动降级到 base64 模式');
          var r=new FileReader();
          r.onload=function(){item.url=r.result;item.status='success';item.isBase64=true;batchUploadActive--;renderBatchPanel(callbackId);processBatchQueue(callbackId);};
          r.onerror=function(){item.status='error';item.error='降级也失败了';batchUploadActive--;renderBatchPanel(callbackId);processBatchQueue(callbackId);};
          r.readAsDataURL(useBlob);
        }else{item.status='error';item.error='HTTP '+xhr.status;batchUploadActive--;renderBatchPanel(callbackId);processBatchQueue(callbackId);}
      });
      xhr.addEventListener('error',function(){item.status='error';item.error='网络错误';batchUploadActive--;renderBatchPanel(callbackId);processBatchQueue(callbackId);});
      xhr.send(form);
    }else{
      // 无 ImgBB Key → 压缩后 base64 内联
      var r=new FileReader();
      r.onload=function(){
        item.url=r.result;item.status='success';item.isBase64=true;
        batchUploadActive--;renderBatchPanel(callbackId);processBatchQueue(callbackId);
      };
      r.onerror=function(){item.status='error';item.error='读取失败';batchUploadActive--;renderBatchPanel(callbackId);processBatchQueue(callbackId);};
      r.readAsDataURL(useBlob);
    }
  };
  compressImage(file,IMG_MAX_WIDTH,IMG_JPEG_QUALITY).then(doUpload).catch(function(){doUpload(file);});
}

function retryBatchItem(id,callbackId){
  var item=batchUploadQueue.find(i=>i.id===id);
  if(item){item.status='pending';item.progress=0;item.error='';processBatchQueue(callbackId);}
}

function cancelBatchUpload(){
  batchUploadCancelled=true;
  batchUploadQueue.forEach(function(i){if(i.status==='pending')i.status='cancelled';});
}

function getBatchUploadedUrls(){
  return batchUploadQueue.filter(i=>i.status==='success'&&i.url).map(i=>i.url);
}

async function doLogin(){
  const btn=$('loginBtn');const origText=btn.textContent;
  btn.disabled=true;btn.textContent='登 录 中...';btn.style.opacity='0.6';
  try{
    const u=$('loginUser').value.trim(),p=$('loginPass').value;
    if(!u||!p){showAlert('loginAlert','请输入用户名和密码','e');return}
    const users=currentUsers||DEFAULT_USERS;
    if(!window.crypto||!window.crypto.subtle){showAlert('loginAlert','浏览器不支持安全加密 (需要 HTTPS)','e');return}
    const hash=await sha256(p+SALT);
    if(users[u]&&users[u].password===hash){
      currentUser={username:u,role:users[u].role};
      sessionStorage.setItem('qrc_user',JSON.stringify(currentUser));
      $('loginPage').style.display='none';$('app').style.display='flex';
      $('sUser').textContent=u;$('sRole').textContent=users[u].role;
      $('tbUser').textContent=u;
      if(users[u].role==='admin'){$('adminSec').style.display='block';$('navUsers').style.display='block'}
      loadConfig();initNav();showPage('dashboard');renderDeployLog();
    }else{
      showAlert('loginAlert','用户名或密码错误','e');
      $('loginPass').value='';$('loginPass').focus();
    }
  }catch(e){
    console.error('Login error:',e);
    showAlert('loginAlert','登录失败：请刷新页面后重试 [E:'+(e.message||'unknown')+']','e');
  }finally{
    btn.disabled=false;btn.textContent=origText;btn.style.opacity='1';
  }
}

function doLogout(){
  currentUser=null;localStorage.removeItem('qrc_user');sessionStorage.removeItem('qrc_user');
  $('loginPage').style.display='flex';$('app').style.display='none';
  $('loginUser').value='';$('loginPass').value='';$('loginAlert').className='alert';$('mainAlert').className='alert';

async function loadConfig(){
  // 检查缓存
  if(cachedConfig){siteConfig=cachedConfig;currentConfig=JSON.parse(JSON.stringify(cachedConfig));return;}
  // 仅使用相对路径，移除 GitHub raw fallback
  var cfgUrl='../config.js?t='+Date.now();
  var loaded=false;
  try{var r=await fetch(cfgUrl);if(r.ok){var t=await r.text();var m=t.match(/SITE_CONFIG\s*=\s*([\s\S]*?);/);if(m){siteConfig=JSON.parse(m[1]);loaded=true}}}catch(e){}
  if(!loaded)siteConfig=JSON.parse(JSON.stringify(DEFAULT_CONFIG));
  cachedConfig=JSON.parse(JSON.stringify(siteConfig));
  currentConfig=JSON.parse(JSON.stringify(siteConfig||DEFAULT_CONFIG));
  const du=loadLocal('deploy');if(du){deployRepo=du.repo||'';deployBranch=du.branch||'gh-pages';deployToken=du.token||'';imgbbKey=du.imgbbKey||''}
  currentUsers=loadLocal('users')||DEFAULT_USERS;
}

// =================== 配置完成度计算 ===================
function calcProgress(){
  const cfg=currentConfig||DEFAULT_CONFIG;
  let total=0,done=0;
  // 品牌名称
  total++;if(i18nGet(cfg.brand?.name,'zh'))done++;
  total++;if(i18nGet(cfg.brand?.name,'en'))done++;
  // Logo
  total++;if(cfg.brand?.logo)done++;
  // Hero
  total++;if(cfg.hero?.image)done++;
  total++;if(i18nGet(cfg.hero?.title,'zh'))done++;
  // 产品
  total++;if((cfg.products||[]).length>=1)done++;
  // 关于
  total++;if(i18nGet(cfg.about?.title,'zh'))done++;
  // 微信
  total++;if(cfg.contact?.wechat?.qrImage)done++;
  // WhatsApp
  total++;if(cfg.contact?.whatsapp?.phone)done++;
  // SEO
  total++;if(i18nGet(cfg.seo?.title,'zh'))done++;
  total++;if(cfg.seo?.description)done++;
  return {done,total,pct:Math.round(done/Math.max(total,1)*100)};
}

// =================== 页面渲染 ===================
function showPage(name){
  $('pageContainer').innerHTML=renderDirtyBanner();$('mainAlert').className='alert';
  switch(name){
    case 'dashboard':renderDashboard();setTimeout(renderDeployLog,100);break;
    case 'brand':renderBrand();break;
    case 'products':renderProducts();break;
    case 'pages':renderPages();break;
    case 'contact':renderContact();break;
    case 'deploy':renderDeploy();break;
    case 'users':renderUsers();break;
  }
}

function colorRow(label,id,val){

function saveProductMeta(e){e.preventDefault();

  currentConfig.productCategories=cats.map(c=>({en:c,zh:c}));

function addProduct(e){e.preventDefault();
  const p={};p.name={};if($('new_pname_en').value)p.name.en=$('new_pname_en').value;if($('new_pname_zh').value)p.name.zh=$('new_pname_zh').value;

  p.price=$('new_price').value;p.image=$('new_pimg').value;
  p.description={};if($('new_pdesc_en').value)p.description.en=$('new_pdesc_en').value;if($('new_pdesc_zh').value)p.description.zh=$('new_pdesc_zh').value;
  (currentConfig.products=currentConfig.products||[]).push(p);
  saveConfig();renderProducts();toast('✅ 产品已添加','success');
}

async function generateSite(deploy){
  if(deploy){
    // 发布前确认对话框（含变更文件列表）
    const brand=i18nGet(currentConfig?.brand?.name)||'未配置';
    const products=(currentConfig?.products||[]).length;
    var changedFiles='';
    try{
      const cf=await API('/api/changed-files');
      if(cf.ok&&cf.changed_files.length){
        changedFiles='\n\n将更新的文件:\n'+cf.changed_files.join('\n');
      }
    }catch(e){}
    const msg=`即将发布到线上\n\n品牌: ${brand}\n产品数: ${products} 个${changedFiles}\n\n确认发布吗？`;
    if(!confirm(msg)){return;}
  }
  const s=$('genStatus');
  if(!s)s.innerHTML='<span style="color:#888">⏳ 正在处理...</span>';
  else{s.innerHTML='<span style="color:#888">⏳ 正在生成 config.js...</span>';}
    saveConfig();
    var prevHash=getConfigHash(currentConfig); // 部署前的配置摘要
    var now=new Date();
    var ver='v'+now.getFullYear()+(now.getMonth()+1).toString().padStart(2,'0')+now.getDate().toString().padStart(2,'0')+now.getHours().toString().padStart(2,'0')+now.getMinutes().toString().padStart(2,'0')+now.getSeconds().toString().padStart(2,'0');
    var cfgFile='config.live.js?v='+Date.now();
    const js=`window.SITE_CONFIG = ${JSON.stringify(currentConfig,null,2)};`;
    if(!deploy){const blob=new Blob([js],{type:'application/javascript'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='config.js';a.click();if(s)s.innerHTML='<span class="s-s">✅ config.js 已下载！</span><br><span style="color:#888">手动替换网站目录中的 config.js 文件即可。</span>';toast('✅ config.js 已下载','success');return}
    if(!deployRepo||!deployToken){if(s)s.innerHTML='<span class="s-e">❌ 请先配置 GitHub 仓库和 Token</span>';toast('❌ 请先配置部署信息','error');return}
    try{
      const repoMatch=deployRepo.match(/github\.com\/([^\/]+?)\/([^\/]+?)(?:\.git)?$/);
      if(!repoMatch){if(s)s.innerHTML='<span class="s-e">❌ 仓库 URL 格式错误</span>';toast('❌ 仓库URL格式错误','error');return}
      const owner=repoMatch[1],repo=repoMatch[2];
      const siteUrl='https://'+owner+'.github.io/'+repo+'/';
      var cfgSize=(js.length/1024).toFixed(0);
      if(s)s.innerHTML='<span style="color:#888">⏳ [1/4] 正在上传配置文件 ('+cfgSize+'KB)...</span>';
      const jsWithVer=`/* ${ver} */\n`+js;
      if(s)s.innerHTML='<span style="color:#888">⏳ [1/4] 正在上传配置文件...（文件较大请耐心等待，最多2分钟）</span>';
      await uploadFile(owner,repo,deployBranch,cfgFile,jsWithVer,'Update site config ['+ver+']',120);
      if(s)s.innerHTML='<span style="color:#888">⏳ [2/4] 正在上传网站主页...</span>';
      const idxResp=await fetch(location.href.replace(/\/admin\/.*/,'/index.html'));
      if(!idxResp.ok)throw new Error('获取网站主页模板失败，请确认网站目录中存在 index.html');
      let idxText=await idxResp.text();
      // 引用新文件名 config.live.js，带时间戳彻底绕过CDN缓存
      idxText=idxText.replace(/config(\.live)?\.js(\?v=[^"]*)?/,'config.live.js?v='+Date.now());
      await uploadFile(owner,repo,deployBranch,'index.html',idxText,'Update site index ['+ver+']',60);
      if(s)s.innerHTML='<span style="color:#888">⏳ [3/4] 正在删除旧配置文件...</span>';
      try{await uploadFile(owner,repo,deployBranch,'config.js','','Remove old config.js',10)}catch(e){}
      if(s)s.innerHTML='<span style="color:#888">⏳ [4/4] 正在上传管理页面...</span>';
      const resp=await fetch(location.href);
      let adminHtmlText=await resp.text();
      adminHtmlText=adminHtmlText.replace('<meta name="robots" content="noindex">','<meta name="robots" content="noindex">\n<meta name="deploy-ver" content="'+ver+'">');
      await uploadFile(owner,repo,deployBranch,'admin/index.html',adminHtmlText,'Update admin page ['+ver+']',60);
      var newHash=getConfigHash(currentConfig);
      var logEntry={user:currentUser?currentUser.username:deployRepo.match(/github\.com\/([^\/]+?)\//)[1],prevConfigHash:prevHash,configHash:newHash,siteUrl:siteUrl,status:'success',version:ver};
      addLog(logEntry);
      var forceUrl=siteUrl+'?t='+Date.now();
      if(s)s.innerHTML=`<span class="s-s">✅ 发布成功！</span><br>🌐 <a href="${forceUrl}" target="_blank">🔄 立即访问网站</a><br>🔧 <a href="${forceUrl}admin/" target="_blank">管理后台</a><br><span style="color:#888">⚡ 使用新配置文件 <code>${cfgFile}</code>，完全绕过CDN缓存</span>`;
      toast('🎉 网站发布成功！','success');
      clearDirty();
  }catch(e){
    var errMsg=e.message||'未知错误';
    if(errMsg.includes('timeout')||errMsg.includes('aborted')){errMsg='上传超时！文件太大，建议减少图片数量或尺寸后重试。单个base64图片建议不超过200KB。';}
    if(errMsg.includes('401')||errMsg.includes('403')){errMsg='Token 无效或权限不足，请检查 Token 是否有 Contents 写入权限';}
    if(errMsg.includes('413')||errMsg.includes('payload')){errMsg='文件过大，请减少上传的图片大小';}
    if(s)s.innerHTML=`<span class="s-e">❌ 部署失败: ${errMsg}</span>`;
    toast('❌ 部署失败: '+errMsg,'error');
    var logEntry={user:currentUser?currentUser.username:'-',status:'fail',changeDesc:errMsg,time:new Date().toLocaleString('zh-CN')};
    addLog(logEntry);
  }
}

// uploadFile: 使用 XMLHttpRequest 支持上传进度
function uploadFile(owner,repo,branch,path,content,msg,timeoutSec){
  return new Promise(function(resolve,reject){
    timeoutSec=timeoutSec||30;
    var sha=null;
    // 先获取文件SHA
    fetch(`https://api.github.com/repos/${owner}/${repo}/contents/${path}?ref=${branch}`,{
      headers:{Authorization:`Bearer ${deployToken}`,Accept:'application/vnd.github.v3+json'}
    }).then(function(resp){
      if(resp.ok)return resp.json().then(function(d){sha=d.sha});
    }).catch(function(){}).then(function(){
      // 上传文件（带进度）
      var xhr=new XMLHttpRequest();
      var timer=setTimeout(function(){xhr.abort();},timeoutSec*1000);
      var encoded=btoa(unescape(encodeURIComponent(content)));
      var body=JSON.stringify({message:msg,content:encoded,branch:branch});
      if(sha)body=JSON.stringify({message:msg,content:encoded,branch:branch,sha:sha});
      xhr.open('PUT',`https://api.github.com/repos/${owner}/${repo}/contents/${path}`);
      xhr.setRequestHeader('Authorization',`Bearer ${deployToken}`);
      xhr.setRequestHeader('Content-Type','application/json');
      xhr.setRequestHeader('Accept','application/vnd.github.v3+json');
      xhr.upload.addEventListener('progress',function(e){
        if(e.lengthComputable){
          var pct=Math.round(e.loaded/e.total*100);
          var st=$('genStatus');
          if(st&&pct<100)st.innerHTML='<span style="color:#888">⏳ 上传中... '+pct+'%</span>';
        }
      });
      xhr.addEventListener('load',function(){
        clearTimeout(timer);
        if(xhr.status>=200&&xhr.status<300){
          resolve(JSON.parse(xhr.responseText));
        }else{
          var err='上传失败(HTTP '+xhr.status+')';
          try{var d=JSON.parse(xhr.responseText);if(d.message)err=d.message;}catch(e){}
          reject(new Error(err));
        }
      });
      xhr.addEventListener('error',function(){clearTimeout(timer);reject(new Error('网络错误，请检查网络连接'));});
      xhr.addEventListener('timeout',function(){clearTimeout(timer);reject(new Error('上传超时('+timeoutSec+'s)，文件可能过大，请减少图片大小后重试'));});
      xhr.addEventListener('abort',function(){clearTimeout(timer);reject(new Error('上传被中断'));});
      xhr.send(body);
    });
  });
}

    </div></form>`;
}

async function createUser(e){e.preventDefault();
  const name=$('nu_name').value.trim(),pass=$('nu_pass').value,role=$('nu_role').value;
  if(currentUsers[name]){toast('❌ 用户已存在','error');return}
  const hash=await sha256(pass+SALT);currentUsers[name]={username:name,password:hash,role:role};
  saveLocal('users',currentUsers);renderUsers();toast('✅ 用户 '+name+' 创建成功','success');
}
async function updateUserPass(e){e.preventDefault();
  const name=$('up_name').value.trim(),pass=$('up_pass').value;
  if(!currentUsers[name]){toast('❌ 用户不存在','error');return}
  currentUsers[name].password=await sha256(pass+SALT);
  saveLocal('users',currentUsers);renderUsers();toast('✅ '+name+' 密码已更新','success');
}
function deleteUser(name){if(!confirm('确认删除用户 '+name+'？'))return;delete currentUsers[name];saveLocal('users',currentUsers);renderUsers();toast(name+' 已删除','info')}

function saveConfig(){localStorage.setItem('qrc_config',JSON.stringify(currentConfig));markDirty()}

// ===== 部署日志 =====
const MAX_LOG=50; // 最多保留50条
function loadLogs(){
  try{return JSON.parse(localStorage.getItem('qrc_logs')||'[]')}catch(e){return []}
}
function saveLogs(logs){
  logs=logs.slice(0,MAX_LOG);
  localStorage.setItem('qrc_logs',JSON.stringify(logs));
}
function addLog(entry){
  const logs=loadLogs();
  // 计算本次变更摘要
  var changes=[];
  if(entry.configHash){
    var prev=logs.find(function(l){return l.configHash===entry.prevConfigHash});
    if(prev&&prev.changes&&entry.changes){
      Object.keys(entry.changes).forEach(function(k){
        var labels={brand:'品牌设置',products:'产品管理',contact:'联系方式',hero:'首屏Hero',about:'关于我们',seo:'SEO设置',i18n:'语言设置',navigation:'导航菜单',advanced:'高级设置',productCategories:'产品分类',productsMeta:'产品区块'};
        changes.push(labels[k]||k);
      });
    }else{changes=['首次完整发布'];}
  }else{changes=['管理页面更新'];}
  entry.changes=changes;
  entry.time=new Date().toLocaleString('zh-CN',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit'});
  logs.unshift(entry);
  saveLogs(logs);
  renderDeployLog();
}
function renderDeployLog(){
  var area=$('deployLogArea');if(!area)return;
  var logs=loadLogs();
  if(!logs.length){area.innerHTML='<div class="empty">暂无发布记录</div>';return;}
  var html='<table style="font-size:12px"><thead><tr><th>时间</th><th>操作人</th><th>变更内容</th><th>状态</th><th>站点</th></tr></thead><tbody>';
  logs.forEach(function(l){
    var statusHtml=l.status==='success'?'<span style="color:var(--success)">✅ 成功</span>':'<span style="color:var(--danger)">❌ 失败</span>';
    var siteUrl='-';if(l.siteUrl)siteUrl='<a href="'+l.siteUrl+'" target="_blank" style="color:var(--primary)">访问</a>';
    var chStr=l.changes&&l.changes.length?l.changes.join(', '):(l.changeDesc||'-');
    html+='<tr><td style="white-space:nowrap">'+esc(l.time||'')+'</td><td>'+esc(l.user||'-')+'</td><td style="max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="'+esc(chStr)+'">'+esc(chStr)+'</td><td>'+statusHtml+'</td><td>'+siteUrl+'</td></tr>';
  });
  html+='</tbody></table>';
  if(logs.length>1)html+='<div style="margin-top:8px;text-align:right"><button class="btn btn-o btn-sm" onclick="clearDeployLog()">🗑 清空日志</button></div>';
  area.innerHTML=html;
}
function clearDeployLog(){
  if(!confirm('确认清空所有发布日志？'))return;
  localStorage.removeItem('qrc_logs');
  renderDeployLog();
  toast('日志已清空','info');
}
function getConfigHash(cfg){
  var keys=['brand','products','contact','hero','about','seo','i18n','navigation','productCategories','productsMeta','advanced'];
  var partial={};
  keys.forEach(function(k){if(cfg[k])partial[k]=k==='products'?(cfg[k]||[]).length:k==='productCategories'?(cfg[k]||[]).length:JSON.stringify(cfg[k])});
  var s=JSON.stringify(partial);
  var h=0;
  for(var i=0;i<s.length;i++){h=((h<<5)-h)+s.charCodeAt(i);h=h&h;}
  return Math.abs(h).toString(16);
}

// ===== 网站二维码生成（API方式）=====
var _siteQRUrl='';
function genSiteURL(){
  var m=deployRepo?deployRepo.match(/github\.com\/([^\/]+?)\/([^\/]+?)(?:\.git)?$/):null;
  if(m){_siteQRUrl='https://'+m[1]+'.github.io/'+m[2]+'/';}
  else{_siteQRUrl='https://'+location.hostname+location.pathname.replace(/\/admin\/?$/,'/');}
  return _siteQRUrl;
}
function genSiteQR(){
  var url=genSiteURL();
  var area=$('qrcodeArea');
  area.innerHTML='<div style=\"color:#888;font-size:13px;padding:20px 0\">\u2699\ufe0f \u6b63\u5728\u751f\u6210...</div>';
  $('qrcodeUrl').innerHTML='';
  $('downloadQRBn').style.display='none';
  var img=document.createElement('img');
  img.style.maxWidth='220px';img.style.borderRadius='8px';img.style.border='1px solid var(--border)';
  img.onload=function(){
    area.innerHTML='';area.appendChild(img);
    $('qrcodeUrl').innerHTML='\ud83d\udcc5 '+url;
    $('downloadQRBn').style.display='inline-block';
    toast('\ud83d\udce6 \u7f51\u7ad9\u4e8c\u7ef4\u7801\u5df2\u751f\u6210','success');
  };
  img.onerror=function(){
    area.innerHTML='\u274c \u751f\u6210\u5931\u8d25\uff0c\u8bf7\u68c0\u67e5\u7f51\u7edc';
    toast('\u4e8c\u7ef4\u7801\u751f\u6210\u5931\u8d25','error');
  };
  img.src='https://api.qrserver.com/v1/create-qr-code/?size=220x220&data='+encodeURIComponent(url);
}
function downloadQR(){
  var img=$('qrcodeArea').querySelector('img');
  if(!img){toast('\u8bf7\u5148\u751f\u6210\u4e8c\u7ef4\u7801','error');return;}
  var canvas=document.createElement('canvas');canvas.width=img.naturalWidth;canvas.height=img.naturalHeight;canvas.getContext('2d').drawImage(img,0,0);
  var a=document.createElement('a');a.download='site-qrcode.png';a.href=canvas.toDataURL('image/png');a.click();
  toast('\ud83d\udce6 \u4e8c\u7ef4\u7801\u5df2\u4e0b\u8f7d','info');
}
