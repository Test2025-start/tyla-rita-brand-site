<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600">
  <defs>
    <linearGradient id="surface" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#faf8f5;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#ede8e0;stop-opacity:1"/>
    </linearGradient>
    <radialGradient id="spotlight" cx="50%" cy="30%" r="60%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.9"/>
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0d78c"/>
      <stop offset="30%" style="stop-color:#e2b04a"/>
      <stop offset="50%" style="stop-color:#f7e8b0"/>
      <stop offset="70%" style="stop-color:#d4a017"/>
      <stop offset="100%" style="stop-color:#c9970a"/>
    </linearGradient>
    <linearGradient id="goldGrad2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#c9970a"/>
      <stop offset="50%" style="stop-color:#f7e8b0"/>
      <stop offset="100%" style="stop-color:#e2b04a"/>
    </linearGradient>
    <radialGradient id="sapphireGrad" cx="45%" cy="35%" r="50%">
      <stop offset="0%" style="stop-color:#d4f0ff"/>
      <stop offset="35%" style="stop-color:#3498db"/>
      <stop offset="100%" style="stop-color:#0a2463"/>
    </radialGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#000" flood-opacity="0.15"/></filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="600" height="600" fill="url(#surface)"/>
  <rect width="600" height="600" fill="url(#spotlight)"/>
  <g transform="translate(300,270)" filter="url(#shadow)">
    <path d="M-80,-70 C-40,-120 40,-120 80,-70" fill="none" stroke="url(#goldGrad)" stroke-width="2.5"/>
    <path d="M-70,-60 C-35,-100 35,-100 70,-60" fill="none" stroke="url(#goldGrad2)" stroke-width="1.2" opacity="0.6"/>
    <g transform="translate(0,5)">
      <polygon points="0,-45 28,-25 0,30 -28,-25" fill="url(#goldGrad)"/>
      <polygon points="0,-38 22,-22 0,22 -22,-22" fill="url(#sapphireGrad)" stroke="url(#goldGrad2)" stroke-width="1"/>
      <polygon points="-5,-15 10,-8 0,5 -12,-10" fill="white" opacity="0.15"/>
      <circle cx="0" cy="-32" r="3" fill="white" opacity="0.6"/>
    </g>
    <circle cx="0" cy="-60" r="4" fill="url(#goldGrad)" filter="url(#softGlow)"/>
  </g>
  <text x="300" y="560" text-anchor="middle" font-family="Georgia,serif" font-size="14" fill="#d4c5b9" letter-spacing="8" opacity="0.6">LUXE JEWELRY</text>
</svg>