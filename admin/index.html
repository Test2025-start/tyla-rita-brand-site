<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<meta name="robots" content="noindex">
<title>管理后台 — Site Admin</title>
<style>
/* ========== 基础变量 ========== */
:root{--primary:#C9A96E;--primary-dark:#B08D4A;--bg:#F8F6F3;--white:#FFF;--text:#2D2D2D;--text-light:#888;--border:#E5E0D8;--danger:#E74C3C;--success:#27AE60;--radius:8px}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);-webkit-tap-highlight-color:transparent}

/* ========== 登录页 ========== */
#loginPage{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
.login-box{background:var(--white);border:1px solid var(--border);border-radius:12px;padding:40px;width:100%;max-width:380px;box-shadow:0 4px 24px rgba(0,0,0,.06)}
.login-box h1{font-size:22px;text-align:center;margin-bottom:4px}
.login-box .sub{font-size:13px;color:#999;text-align:center;margin-bottom:28px}
.fg{margin-bottom:14px}
.fg label{display:block;font-size:14px;font-weight:500;margin-bottom:5px;color:#555}
.fg .lh{font-size:11px;color:var(--primary);font-weight:600;margin-bottom:2px}
.fi{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:6px;font-size:15px;background:var(--white);-webkit-appearance:none}
.fi:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 2px rgba(201,169,110,.15)}
textarea.fi{resize:vertical;min-height:70px}
.fr{display:flex;gap:12px}.fr .fg{flex:1}
.cr{display:flex;gap:8px;align-items:center}
.cr input[type=color]{width:36px;height:36px;border:1px solid var(--border);border-radius:6px;cursor:pointer;padding:2px}
.chk{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.chk input[type=checkbox]{width:18px;height:18px;accent-color:var(--primary)}
.btn{display:inline-block;padding:10px 20px;border:none;border-radius:6px;font-size:14px;cursor:pointer;font-weight:500;transition:.15s;text-decoration:none;touch-action:manipulation}
.btn-p{background:var(--primary);color:#FFF}.btn-p:hover{background:var(--primary-dark)}
.btn-d{background:var(--danger);color:#FFF}.btn-s{background:var(--success);color:#FFF}
.btn-o{background:white;border:1px solid var(--border);color:var(--text)}.btn-o:hover{border-color:var(--primary);color:var(--primary)}
.btn-sm{padding:6px 12px;font-size:12px}
.btn-block{display:block;width:100%;text-align:center}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-login{width:100%;padding:12px;background:var(--primary);color:#FFF;border:none;border-radius:6px;font-size:16px;font-weight:600;cursor:pointer;margin-top:8px}
.btn-login:hover{background:var(--primary-dark)}
.alert{padding:10px 14px;border-radius:6px;font-size:13px;margin-bottom:14px;display:none}
.alert.show{display:block;animation:fadeIn .3s}
.alert-e{background:#FDECEA;color:var(--danger);border:1px solid #FADBD8}
.alert-s{background:#E8F8F5;color:var(--success);border:1px solid #D5F5E3}
@keyframes fadeIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:translateY(0)}}

/* ========== Toast 浮动提示 ========== */
#toastContainer{position:fixed;top:16px;right:16px;z-index:9999;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{pointer-events:auto;padding:12px 20px;border-radius:8px;font-size:14px;font-weight:500;color:#FFF;box-shadow:0 6px 24px rgba(0,0,0,.15);animation:toastIn .35s ease;max-width:340px;line-height:1.4}
.toast-success{background:linear-gradient(135deg,#27AE60,#2ECC71)}
.toast-error{background:linear-gradient(135deg,#E74C3C,#EC7063)}
.toast-info{background:linear-gradient(135deg,#3498DB,#5DADE2)}
@keyframes toastIn{from{opacity:0;transform:translateX(60px)}to{opacity:1;transform:translateX(0)}}
@keyframes toastOut{from{opacity:1;transform:translateX(0)}to{opacity:0;transform:translateX(60px)}}

/* ========== 图片上传组件 ========== */
.img-upload-wrap{display:flex;align-items:center;gap:8px}
.img-upload-wrap .fi{flex:1}
.img-up-btn{display:inline-flex;align-items:center;gap:4px;padding:9px 14px;background:#F5F0EB;border:1px dashed #C9A96E;border-radius:6px;color:var(--primary-dark);font-size:13px;font-weight:500;cursor:pointer;transition:.15s;white-space:nowrap;flex-shrink:0}
.img-up-btn:hover{background:#EDE5DA}
.img-up-btn input{display:none}
.img-preview{margin-top:6px;display:none}
.img-preview.show{display:block}
.img-preview img{max-width:120px;max-height:80px;border-radius:6px;border:1px solid var(--border);object-fit:cover}
.img-preview .img-rm{display:inline-block;margin-left:8px;font-size:12px;color:var(--danger);cursor:pointer;text-decoration:none}

/* ========== 桌面布局 ========== */
#app{display:none;min-height:100vh}
.topbar{display:none;position:fixed;top:0;left:0;right:0;z-index:200;background:#1E1E1E;color:#FFF;padding:12px 16px;align-items:center;justify-content:space-between}
.topbar .tb-logo{font-size:16px;font-weight:700;color:var(--primary)}
.topbar .tb-menu{background:none;border:none;color:#FFF;font-size:24px;cursor:pointer;padding:4px 8px;line-height:1}
.sidebar{width:220px;background:#1E1E1E;color:#CCC;position:fixed;top:0;left:0;bottom:0;z-index:100;display:flex;flex-direction:column;transition:transform .25s}
.sidebar-logo{padding:24px 20px 16px;font-size:18px;font-weight:700;color:var(--primary);border-bottom:1px solid #333}
.sidebar-info{padding:10px 20px;font-size:12px;color:#888;border-bottom:1px solid #333}
.sidebar-info .role{color:var(--primary);font-size:11px;margin-top:2px}
.sidebar-nav{flex:1;padding:8px 0;overflow-y:auto}
.sidebar-nav a{display:block;padding:12px 20px;color:#AAA;text-decoration:none;font-size:14px;border-left:3px solid transparent;cursor:pointer;transition:.15s}
.sidebar-nav a:hover,.sidebar-nav a.active{color:#FFF;background:#2A2A2A;border-left-color:var(--primary)}
.sidebar-nav .sec{padding:12px 20px 4px;font-size:11px;color:#666;text-transform:uppercase;letter-spacing:2px}
.sidebar-footer{padding:16px 20px;border-top:1px solid #333}
.sidebar-footer a{color:#888;font-size:13px;text-decoration:none;cursor:pointer}
.sidebar-footer a:hover{color:#FFF}
.sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:99}
.main{margin-left:220px;flex:1;padding:28px 36px;max-width:960px}
.page-title{font-size:22px;font-weight:600;margin-bottom:20px}
.card{background:var(--white);border:1px solid var(--border);border-radius:var(--radius);padding:20px 24px;margin-bottom:18px}
.card-title{font-size:15px;font-weight:600;margin-bottom:14px;padding-bottom:10px;border-bottom:1px solid var(--border)}
.tag{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600}
.tag-admin{background:#FDEBD0;color:#B9770E}.tag-editor{background:#D5F5E3;color:#1E8449}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:20px}
.stat-card{background:var(--white);border:1px solid var(--border);border-radius:var(--radius);padding:18px;text-align:center}
.stat-card .num{font-size:28px;font-weight:700;color:var(--primary)}
.stat-card .lbl{font-size:12px;color:var(--text-light);margin-top:4px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;padding:8px 10px;border-bottom:2px solid var(--border);font-weight:600;color:#555;font-size:11px;text-transform:uppercase}
td{padding:8px 10px;border-bottom:1px solid var(--border);vertical-align:middle}
tr:hover td{background:#FAFAFA}
.empty{text-align:center;padding:32px;color:var(--text-light)}
.status{margin-top:14px;font-size:13px;line-height:1.6}
.s-e{color:var(--danger)}.s-s{color:var(--success)}.s-w{color:#E67E22}
.depoly-actions{display:flex;flex-wrap:wrap;gap:10px}

/* ========== 仪表盘专用样式 ========== */
.dash-welcome{background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:#FFF;border-radius:12px;padding:28px 30px;margin-bottom:20px;position:relative;overflow:hidden}
.dash-welcome::after{content:'';position:absolute;top:-30px;right:-20px;width:120px;height:120px;background:rgba(255,255,255,.08);border-radius:50%}
.dash-welcome h2{font-size:22px;margin-bottom:6px}
.dash-welcome p{font-size:13px;opacity:.85}
.dash-welcome .site-link{display:inline-block;margin-top:10px;padding:6px 16px;background:rgba(255,255,255,.2);border-radius:20px;color:#FFF;font-size:12px;text-decoration:none;transition:.15s}
.dash-welcome .site-link:hover{background:rgba(255,255,255,.3)}

.guide-steps{counter-reset:step}
.guide-step{display:flex;gap:14px;align-items:flex-start;padding:14px 0;border-bottom:1px solid var(--border);counter-increment:step}
.guide-step:last-child{border-bottom:none}
.guide-num{flex-shrink:0;width:32px;height:32px;background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:#FFF;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700}
.guide-num::before{content:counter(step)}
.guide-body{flex:1}
.guide-body .gt{font-size:14px;font-weight:600;margin-bottom:2px}
.guide-body .gd{font-size:12px;color:var(--text-light);line-height:1.5}
.guide-body .gb{display:inline-block;margin-top:6px;padding:4px 12px;background:var(--primary);color:#FFF;border-radius:4px;font-size:12px;text-decoration:none;cursor:pointer;transition:.15s}
.guide-body .gb:hover{background:var(--primary-dark)}

.progress-bar{height:8px;background:#EEE;border-radius:4px;overflow:hidden;margin:8px 0 4px}
.progress-fill{height:100%;border-radius:4px;background:linear-gradient(90deg,var(--primary),var(--primary-dark));transition:width .5s ease}

.quick-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.quick-item{display:flex;align-items:center;gap:10px;padding:14px 16px;background:#FAFAFA;border:1px solid var(--border);border-radius:8px;cursor:pointer;transition:.15s;text-decoration:none;color:var(--text)}
.quick-item:hover{border-color:var(--primary);background:#FDFBF7}
.quick-item .qi-icon{font-size:24px;flex-shrink:0}
.quick-item .qi-text{font-size:13px;font-weight:500}
.quick-item .qi-sub{font-size:11px;color:var(--text-light)}

/* ========== 移动端适配 (<768px) ========== */
@media(max-width:768px){
  .login-box{padding:28px 20px}
  .topbar{display:flex}
  .sidebar{transform:translateX(-100%);width:260px;padding-top:52px;z-index:150}
  .sidebar.open{transform:translateX(0)}
  .sidebar-overlay.show{display:block}
  .sidebar-logo{display:none}
  .main{margin-left:0;padding:60px 16px 24px;max-width:100%}
  .main .card{padding:16px;margin-bottom:12px}
  .page-title{font-size:18px;margin-bottom:14px}
  .fr{flex-direction:column;gap:0}
  .stats{grid-template-columns:1fr;gap:10px}
  .stat-card{padding:14px}
  .stat-card .num{font-size:22px}
  .fi{font-size:16px;padding:11px 12px}
  .btn{padding:12px 20px;font-size:15px}
  .btn-sm{padding:7px 14px;font-size:13px}
  .depoly-actions .btn{width:100%}
  th,td{font-size:12px;padding:6px 8px}
  table{display:block;overflow-x:auto;-webkit-overflow-scrolling:touch}
  select.fi{font-size:16px}
  #toastContainer{top:auto;bottom:16px;right:16px;left:16px}
  .toast{max-width:100%}
  .dash-welcome{padding:20px}
  .dash-welcome h2{font-size:18px}
  .quick-grid{grid-template-columns:1fr}
  .img-upload-wrap{flex-direction:column;align-items:stretch}
  .img-up-btn{justify-content:center}
}
</style>
</head>
<body>

<!-- ===== Toast 容器 ===== -->
<div id="toastContainer"></div>

<!-- ===== 登录页 ===== -->
<div id="loginPage">
  <div class="login-box">
    <h1>⚡ 管理后台</h1>
    <p class="sub">营销网站配置 & 一键部署</p>
    <div class="alert" id="loginAlert"></div>
    <div class="fg"><label>用户名</label><input type="text" id="loginUser" class="fi" placeholder="输入用户名" autofocus autocomplete="username"></div>
    <div class="fg"><label>密码</label><input type="password" id="loginPass" class="fi" placeholder="输入密码" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()"></div>
    <button class="btn-login" id="loginBtn" onclick="doLogin()">登 录</button>
    <p style="text-align:center;font-size:12px;color:#BBB;margin-top:16px">默认: admin / admin123</p>
  </div>
</div>

<!-- ===== 主应用 ===== -->
<div id="app">
  <!-- 移动端顶栏 -->
  <div class="topbar" id="topbar">
    <button class="tb-menu" onclick="toggleSidebar()" aria-label="菜单">☰</button>
    <span class="tb-logo">⚡ Site Admin</span>
    <span style="font-size:12px;color:#888" id="tbUser"></span>
  </div>

  <!-- 遮罩 -->
  <div class="sidebar-overlay" id="overlay" onclick="toggleSidebar()"></div>

  <!-- 侧边栏 -->
  <nav class="sidebar" id="sidebar">
    <div class="sidebar-logo">⚡ Site Admin</div>
    <div class="sidebar-info"><span id="sUser"></span><div class="role" id="sRole"></div></div>
    <div class="sidebar-nav">
      <a class="active" data-page="dashboard">📊 仪表盘</a>
      <div class="sec">内容配置</div>
      <a data-page="brand">🏷️ 品牌设置</a>
      <a data-page="products">🛍️ 产品管理</a>
      <a data-page="pages">📄 页面内容</a>
      <a data-page="contact">📞 联系方式</a>
      <div class="sec">发布</div>
      <a data-page="deploy">🚀 生成 & 部署</a>
      <div class="sec" id="adminSec" style="display:none">管理</div>
      <a data-page="users" id="navUsers" style="display:none">👥 用户管理</a>
    </div>
    <div class="sidebar-footer"><a onclick="doLogout()">退出登录 →</a></div>
  </nav>

  <main class="main">
    <div class="alert" id="mainAlert"></div>
    <div id="pageContainer"></div>
  </main>
</div>

<script>
// =================== 全局函数 ===================
async function sha256(m){const e=new TextEncoder().encode(m);const h=await crypto.subtle.digest('SHA-256',e);return Array.from(new Uint8Array(h)).map(b=>b.toString(16).padStart(2,'0')).join('')}
function $(id){return document.getElementById(id)}
function qsa(sel){return document.querySelectorAll(sel)}
function showAlert(elId, msg, type){const e=$(elId);e.textContent=msg;e.className='alert alert-'+type+' show';setTimeout(()=>e.classList.remove('show'),4000)}

// =================== Toast 浮动提示 ===================
function toast(msg,type){type=type||'success';
  const c=$('toastContainer');
  const el=document.createElement('div');
  el.className='toast toast-'+type;
  const icon={success:'✅',error:'❌',info:'ℹ️'}[type]||'✅';
  el.innerHTML=`<span>${icon}</span> ${msg}`;
  c.appendChild(el);
  setTimeout(()=>{el.style.animation='toastOut .3s ease forwards';setTimeout(()=>el.remove(),300)},2500);
}

// =================== 移动端侧边栏 ===================
function toggleSidebar(){
  const sb=$('sidebar'),ov=$('overlay');
  sb.classList.toggle('open');ov.classList.toggle('show');
}
function closeSidebar(){
  $('sidebar').classList.remove('open');$('overlay').classList.remove('show');
}

// =================== 配置 ===================
const DEFAULT_CONFIG={
  i18n:{defaultLanguage:"en",languages:["en","zh"]},
  brand:{name:{en:"Your Brand",zh:"您的品牌"},slogan:{en:"Everyday Elegance",zh:"优雅每一天"},logo:"",primaryColor:"#C9A96E",secondaryColor:"#2D2D2D",bgColor:"#FFFFFF",accentBg:"#FAF8F5"},
  navigation:[{id:"home",label:{en:"Home",zh:"首页"},href:"#home"},{id:"products",label:{en:"Products",zh:"产品"},href:"#products"},{id:"about",label:{en:"About",zh:"关于"},href:"#about"},{id:"contact",label:{en:"Contact",zh:"联系"},href:"#contact"}],
  hero:{image:"",title:{en:"Your Brand",zh:"您的品牌"},subtitle:{en:"Everyday Elegance",zh:"优雅每一天"},ctaText:{en:"Explore Collection",zh:"探索产品"},ctaLink:"#products"},
  productsMeta:{title:{en:"Our Products",zh:"我们的产品"}},
  productCategories:[{en:"All",zh:"全部"},{en:"New Arrivals",zh:"新品上市"},{en:"Best Sellers",zh:"热销推荐"},{en:"Classic",zh:"经典系列"}],
  products:[{name:{en:"Freshwater Pearl Necklace",zh:"淡水珍珠项链"},category:{en:"Best Sellers",zh:"热销推荐"},price:"$29.00",image:"",description:{en:"Elegant freshwater pearls.",zh:"优雅淡水珍珠"}}],
  about:{image:"",title:{en:"About Us",zh:"关于我们"},paragraphs:[{en:"Our brand was born from a passion for beauty.",zh:"我们的品牌始于对美的追求。"},{en:"Every piece is carefully selected.",zh:"每一件产品都经过精心挑选。"}]},
  contact:{title:{en:"Contact Us",zh:"联系我们"},wechat:{enabled:true,qrImage:"",label:{en:"WeChat",zh:"微信咨询"},hint:{en:"Scan to add on WeChat",zh:"扫描二维码添加微信好友"},modalTitle:{en:"Add on WeChat",zh:"添加微信"},modalHint:{en:"Scan the QR code with WeChat",zh:"请使用微信扫描下方二维码"}},whatsapp:{enabled:true,phone:"8613800138000",message:{en:"Hello!",zh:"你好！"},qrImage:"",label:{en:"WhatsApp",zh:"WhatsApp 联系"},hint:{en:"Chat on WhatsApp",zh:"点击通过 WhatsApp 联系我们"},modalTitle:{en:"WhatsApp",zh:"WhatsApp 联系"},modalHint:{en:"Scan or click",zh:"扫描或点击聊天"}},website:{enabled:false,url:"",label:{en:"Visit Website",zh:"访问官方网站"},openNewTab:true},email:{enabled:false,address:"",label:{en:"Send Email",zh:"发送邮件"}},siteQR:{enabled:false,url:"",label:{en:"Scan to Visit",zh:"扫码访问"},hint:{en:"QR to site",zh:"扫码打开网站"},showOnPage:true,qrImage:""}},
  seo:{title:{en:"Your Brand | Jewelry",zh:"您的品牌 | 珠宝"},description:{en:"Discover handcrafted jewelry.",zh:"发现手工珠宝。"},keywords:"jewelry, accessories",ogImage:"",favicon:""},
  advanced:{gaTrackingId:"",showFloatingWhatsApp:true}
};

const DEFAULT_USERS={admin:{username:"admin",password:"bd04502e85c0a9125c700bd88fff42aaf315a90f97b21848c13f3a7f0e93cb33",role:"admin"}};
const SALT="qrcode-landing-2026";

// =================== 状态 ===================
let currentUser=null,currentConfig=null,currentUsers=null;
let deployRepo="",deployBranch="gh-pages",deployToken="";
let siteConfig=null;

// =================== 工具 ===================
function i18nGet(val,lang){return val&&typeof val==='object'?(val[lang]||val['en']||''):(val||'')}
function i18nSet(existing,lang,value){if(typeof existing==='object'&&existing!==null){existing[lang]=value;return existing}const o={};o[lang]=value;return o}
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}

// =================== 图片上传工具 ===================
function imgField(id,label,val){
  const hasImg=val&&(val.startsWith('data:')||(val.startsWith('/')&&!val.startsWith('/assets')));
  return `<div class="img-upload-wrap"><input class="fi" id="${id}" value="${esc(val||'')}" placeholder="${label}" onchange="onImgChange('${id}')"><label class="img-up-btn">📷 上传<input type="file" accept="image/*" onchange="handleUpload(this,'${id}')"></label></div><div class="img-preview${hasImg?' show':''}" id="${id}_preview">${hasImg?('<img src="'+esc(val)+'" alt="preview"><a class="img-rm" onclick="clearImg(\''+id+'\')">移除</a>'):''}</div>`;
}
function handleUpload(inp,targetId){
  const f=inp.files[0];if(!f)return;
  if(f.size>2*1024*1024){toast('图片不能超过 2MB','error');return}
  const r=new FileReader();
  r.onload=function(){const d=r.result;$(targetId).value=d;const p=$(targetId+'_preview');p.innerHTML='<img src="'+d+'" alt="preview"><a class="img-rm" href="javascript:void(0)" onclick="clearImg(\''+targetId+'\')">移除</a>';p.classList.add('show');toast('图片已上传','info')};
  r.readAsDataURL(f);
}
function onImgChange(id){
  // manual paste of path - no preview update needed for non-data URLs
}
function clearImg(id){$(id).value='';const p=$(id+'_preview');p.innerHTML='';p.classList.remove('show')}

// =================== 存储 ===================
function saveLocal(k,v){try{localStorage.setItem('qrc_'+k,JSON.stringify(v))}catch(e){}}
function loadLocal(k){try{const v=localStorage.getItem('qrc_'+k);return v?JSON.parse(v):null}catch(e){return null}}

// =================== 登录系统 ===================
async function doLogin(){
  const btn=$('loginBtn');const origText=btn.textContent;
  btn.disabled=true;btn.textContent='登 录 中...';btn.style.opacity='0.6';
  try{
    const u=$('loginUser').value.trim(),p=$('loginPass').value;
    if(!u||!p){showAlert('loginAlert','请输入用户名和密码','e');return}
    const users=currentUsers||DEFAULT_USERS;
    if(!window.crypto||!window.crypto.subtle){showAlert('loginAlert','浏览器不支持安全加密 (需要 HTTPS)','e');return}
    const hash=await sha256(p+SALT);
    if(users[u]&&users[u].password===hash){
      currentUser={username:u,role:users[u].role};
      saveLocal('user',currentUser);
      $('loginPage').style.display='none';$('app').style.display='flex';
      $('sUser').textContent=u;$('sRole').textContent=users[u].role;
      $('tbUser').textContent=u;
      if(users[u].role==='admin'){$('adminSec').style.display='block';$('navUsers').style.display='block'}
      loadConfig();initNav();showPage('dashboard');
    }else{
      showAlert('loginAlert','用户名或密码错误','e');
      $('loginPass').value='';$('loginPass').focus();
    }
  }catch(e){
    console.error('Login error:',e);
    showAlert('loginAlert','登录失败：请刷新页面后重试 [E:'+(e.message||'unknown')+']','e');
  }finally{
    btn.disabled=false;btn.textContent=origText;btn.style.opacity='1';
  }
}

function doLogout(){
  currentUser=null;localStorage.removeItem('qrc_user');
  $('loginPage').style.display='flex';$('app').style.display='none';
  $('loginUser').value='';$('loginPass').value='';$('loginAlert').className='alert';$('mainAlert').className='alert';

function initNav(){
  qsa('.sidebar-nav a[data-page]').forEach(a=>a.addEventListener('click',function(e){
    e.preventDefault();showPage(this.dataset.page);closeSidebar();
    qsa('.sidebar-nav a.active').forEach(x=>x.classList.remove('active'));
    this.classList.add('active');
  }));
}

async function loadConfig(){
  try{const r=await fetch('../config.js');if(r.ok){const t=await r.text();const m=t.match(/SITE_CONFIG\s*=\s*([\s\S]*?);/);if(m){siteConfig=JSON.parse(m[1])}}else{siteConfig=JSON.parse(JSON.stringify(DEFAULT_CONFIG))}}catch(e){siteConfig=JSON.parse(JSON.stringify(DEFAULT_CONFIG))}
  currentConfig=JSON.parse(JSON.stringify(siteConfig||DEFAULT_CONFIG));
  const du=loadLocal('deploy');if(du){deployRepo=du.repo||'';deployBranch=du.branch||'gh-pages';deployToken=du.token||''}
  currentUsers=loadLocal('users')||DEFAULT_USERS;
}

// =================== 配置完成度计算 ===================
function calcProgress(){
  const cfg=currentConfig||DEFAULT_CONFIG;
  let total=0,done=0;
  // 品牌名称
  total++;if(i18nGet(cfg.brand?.name,'zh'))done++;
  total++;if(i18nGet(cfg.brand?.name,'en'))done++;
  // Logo
  total++;if(cfg.brand?.logo)done++;
  // Hero
  total++;if(cfg.hero?.image)done++;
  total++;if(i18nGet(cfg.hero?.title,'zh'))done++;
  // 产品
  total++;if((cfg.products||[]).length>=1)done++;
  // 关于
  total++;if(i18nGet(cfg.about?.title,'zh'))done++;
  // 微信
  total++;if(cfg.contact?.wechat?.qrImage)done++;
  // WhatsApp
  total++;if(cfg.contact?.whatsapp?.phone)done++;
  // SEO
  total++;if(i18nGet(cfg.seo?.title,'zh'))done++;
  total++;if(cfg.seo?.description)done++;
  return {done,total,pct:Math.round(done/Math.max(total,1)*100)};
}

// =================== 页面渲染 ===================
function showPage(name){
  $('pageContainer').innerHTML='';$('mainAlert').className='alert';
  switch(name){
    case 'dashboard':renderDashboard();break;
    case 'brand':renderBrand();break;
    case 'products':renderProducts();break;
    case 'pages':renderPages();break;
    case 'contact':renderContact();break;
    case 'deploy':renderDeploy();break;
    case 'users':renderUsers();break;
  }
}

function addProduct(e){e.preventDefault();
  const p={};p.name={};if($('new_pname_en').value)p.name.en=$('new_pname_en').value;if($('new_pname_zh').value)p.name.zh=$('new_pname_zh').value;

function saveDeploy(e){e.preventDefault();deployRepo=$('depo_repo').value;deployBranch=$('depo_branch').value||'gh-pages';deployToken=$('depo_token').value;saveLocal('deploy',{repo:deployRepo,branch:deployBranch,token:deployToken});toast('✅ 部署设置已保存','success');}

// ===== 生成 & 部署 =====
async function generateSite(deploy){
  const s=$('genStatus');if(!s)s.innerHTML='<span style="color:#888">⏳ 正在处理...</span>';
  else{s.innerHTML='<span style="color:#888">⏳ 正在生成 config.js...</span>';}
  saveConfig();
  const js=`window.SITE_CONFIG = ${JSON.stringify(currentConfig,null,2)};`;
  if(!deploy){const blob=new Blob([js],{type:'application/javascript'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='config.js';a.click();if(s)s.innerHTML='<span class="s-s">✅ config.js 已下载！</span><br><span style="color:#888">手动替换网站目录中的 config.js 文件即可。</span>';toast('✅ config.js 已下载','success');return}
  if(!deployRepo||!deployToken){if(s)s.innerHTML='<span class="s-e">❌ 请先配置 GitHub 仓库和 Token</span>';toast('❌ 请先配置部署信息','error');return}
  if(s)s.innerHTML='<span style="color:#888">⏳ 正在部署到 GitHub Pages...</span>';
  try{
    const repoMatch=deployRepo.match(/github\.com\/([^\/]+?)\/([^\/]+?)(?:\.git)?$/);
    if(!repoMatch){if(s)s.innerHTML='<span class="s-e">❌ 仓库 URL 格式错误</span>';toast('❌ 仓库URL格式错误','error');return}
    const owner=repoMatch[1],repo=repoMatch[2];
    await uploadFile(owner,repo,deployBranch,'config.js',js,'Update site config');
    const adminHtml='<!DOCTYPE html>\n'+document.documentElement.outerHTML;
    await uploadFile(owner,repo,deployBranch,'admin/index.html',adminHtml,'Update admin page');
    if(s)s.innerHTML=`<span class="s-s">✅ 发布成功！</span><br>🌐 <a href="https://${owner}.github.io/${repo}/" target="_blank">访问网站</a><br>🔧 <a href="https://${owner}.github.io/${repo}/admin/" target="_blank">管理后台</a><br><span style="color:#888">⏱ 1-2 分钟后生效</span>`;
    toast('🎉 网站发布成功！1-2分钟后生效','success');
  }catch(e){if(s)s.innerHTML=`<span class="s-e">❌ 部署失败: ${e.message}</span>`;toast('❌ 部署失败: '+e.message,'error')}
}

async function uploadFile(owner,repo,branch,path,content,msg){
  let sha=null;
  try{const resp=await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/${path}?ref=${branch}`,{headers:{Authorization:`Bearer ${deployToken}`,Accept:'application/vnd.github.v3+json'}});if(resp.ok){const d=await resp.json();sha=d.sha}}catch(e){}
  const encoded=btoa(unescape(encodeURIComponent(content)));
  const body={message:msg,content:encoded,branch:branch};if(sha)body.sha=sha;
  const resp=await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/${path}`,{method:'PUT',headers:{Authorization:`Bearer ${deployToken}`,'Content-Type':'application/json',Accept:'application/vnd.github.v3+json'},body:JSON.stringify(body)});
  if(!resp.ok){const d=await resp.json();throw new Error(d.message||'上传失败')}
}

// ===== 用户管理 =====
function renderUsers(){
  if(!currentUser||currentUser.role!=='admin'){showPage('dashboard');return}
  const users=currentUsers||DEFAULT_USERS;let rows='';
  Object.values(users).forEach(u=>{rows+=`<tr><td><strong>${esc(u.username)}</strong></td><td><span class="tag ${u.role==='admin'?'tag-admin':'tag-editor'}">${u.role}</span></td><td>${u.username==='admin'?'<span style="font-size:11px;color:#BBB">系统管理员</span>':`<button class="btn btn-d btn-sm" onclick="deleteUser('${esc(u.username)}')">删除</button>`}</td></tr>`});
  $('pageContainer').innerHTML=`
    <h1 class="page-title">👥 用户管理</h1>
    <div class="card"><div class="card-title">用户列表 (${Object.keys(users).length})</div><table><thead><tr><th>用户名</th><th>角色</th><th>操作</th></tr></thead><tbody>${rows}</tbody></table></div>
    <form onsubmit="createUser(event)" style="margin:0"><div class="card"><div class="card-title">＋ 创建用户</div>
      <div class="fr"><div class="fg"><label>用户名</label><input class="fi" id="nu_name" placeholder="新用户名" required></div><div class="fg"><label>密码</label><input type="password" class="fi" id="nu_pass" placeholder="密码" required></div><div class="fg"><label>角色</label><select class="fi" id="nu_role"><option value="editor">Editor</option><option value="admin">Admin</option></select></div></div>
      <button type="submit" class="btn btn-p">＋ 创建用户</button>
    </div></form>
    <form onsubmit="updateUserPass(event)" style="margin:0"><div class="card"><div class="card-title">✏️ 修改密码</div>
      <div class="fr"><div class="fg"><label>用户名</label><input class="fi" id="up_name" placeholder="用户名" required></div><div class="fg"><label>新密码</label><input type="password" class="fi" id="up_pass" placeholder="新密码" required></div></div>
      <button type="submit" class="btn-o btn-sm">✏️ 修改密码</button>
    </div></form>`;
}

async function createUser(e){e.preventDefault();
  const name=$('nu_name').value.trim(),pass=$('nu_pass').value,role=$('nu_role').value;
  if(currentUsers[name]){toast('❌ 用户已存在','error');return}
  const hash=await sha256(pass+SALT);currentUsers[name]={username:name,password:hash,role:role};
  saveLocal('users',currentUsers);renderUsers();toast('✅ 用户 '+name+' 创建成功','success');
}
async function updateUserPass(e){e.preventDefault();
  const name=$('up_name').value.trim(),pass=$('up_pass').value;
  if(!currentUsers[name]){toast('❌ 用户不存在','error');return}
  currentUsers[name].password=await sha256(pass+SALT);
  saveLocal('users',currentUsers);renderUsers();toast('✅ '+name+' 密码已更新','success');
}
function deleteUser(name){if(!confirm('确认删除用户 '+name+'？'))return;delete currentUsers[name];saveLocal('users',currentUsers);renderUsers();toast(name+' 已删除','info')}

function saveConfig(){localStorage.setItem('qrc_config',JSON.stringify(currentConfig));}

// ===== 启动 =====
(async function(){
  currentUsers=loadLocal('users')||DEFAULT_USERS;
  const du=loadLocal('deploy');if(du){deployRepo=du.repo||'';deployBranch=du.branch||'gh-pages';deployToken=du.token||''}
  const savedUser=loadLocal('user');
  try{const r=await fetch('../config.js');if(r.ok){const t=await r.text();const m=t.match(/SITE_CONFIG\s*=\s*([\s\S]*?);/);if(m)siteConfig=JSON.parse(m[1])}}catch(e){siteConfig=JSON.parse(JSON.stringify(DEFAULT_CONFIG))}
  currentConfig=JSON.parse(JSON.stringify(siteConfig||DEFAULT_CONFIG));
  if(savedUser&&currentUsers[savedUser.username]){
    const u=currentUsers[savedUser.username];currentUser=savedUser;
    $('loginPage').style.display='none';$('app').style.display='flex';
    $('sUser').textContent=savedUser.username;$('sRole').textContent=u.role;$('tbUser').textContent=savedUser.username;
    if(u.role==='admin'){$('adminSec').style.display='block';$('navUsers').style.display='block'}
    initNav();showPage('dashboard');
  }else{$('loginUser').focus()}
  $('loginPass').addEventListener('keydown',function(e){if(e.key==='Enter')doLogin()});
})();
</script>
